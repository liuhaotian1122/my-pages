<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://api.liuhaotian.cc.cd" crossorigin>
    <link rel="dns-prefetch" href="https://api.liuhaotian.cc.cd">
    <title>内容管理后台系统 - 浩天的个人站</title>
    <link rel="icon" type="image/png" href="images/i/favicon.png">
    <link rel="stylesheet" href="assets/css/amazeui.min.css">
    <link rel="stylesheet" href="css/public.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto 0;
            padding: 0 15px;
        }

        .header {
            background: linear-gradient(135deg, #e1652f 0%, #ff8a4c 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(225, 101, 47, 0.25);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
        }

        .header:hover::before {
            transform: translateX(100%);
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .main-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
            padding: 20px 15px;
            border-bottom: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-3px);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #e1652f;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .tab-nav {
            display: flex;
            background: #fafafa;
            border-bottom: 2px solid #eee;
        }

        .tab-button {
            flex: 1;
            padding: 18px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            background: white;
            color: #e1652f;
            border-bottom: 3px solid #e1652f;
            font-weight: 600;
        }

        .tab-button:hover {
            background: #f0f0f0;
            color: #e1652f;
        }

        .tab-button.active:hover {
            background: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e1652f;
            box-shadow: 0 0 0 3px rgba(225, 101, 47, 0.12);
            background: white;
        }

        /* AI 帮写按钮条 */
        .ai-write-bar {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .ai-write-btn {
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid rgba(225, 101, 47, 0.45);
            background: rgba(225, 101, 47, 0.06);
            color: #e1652f;
            transition: all 0.2s ease;
        }

        .ai-write-btn:hover {
            background: #e1652f;
            color: #fff;
        }

        .ai-write-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* AI 标签/摘要生成按钮行 */
        .ai-meta-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .ai-meta-row input {
            flex: 1 1 auto;
            width: auto;
            min-width: 0;
        }

        /* AI 站点周报卡片 */
        .ai-weekly-card {
            background: linear-gradient(135deg, #fff7f0 0%, #ffefe4 100%);
            border: 1px solid rgba(225, 101, 47, 0.25);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(225, 101, 47, 0.12);
        }

        .ai-weekly-head {
            font-weight: 700;
            color: #e1652f;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .ai-weekly-text {
            color: #7a4a2b;
            font-size: 14px;
            line-height: 1.7;
        }

        .ai-weekly-stats {
            margin-top: 8px;
            font-size: 12px;
            color: #b06a3f;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex: 1;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e1652f 0%, #ff8a4c 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(225, 101, 47, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #ef5350 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(244, 67, 54, 0.2);
        }

        .btn-info {
            background: linear-gradient(135deg, #2196f3 0%, #42a5f5 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(33, 150, 243, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .data-list {
            margin-top: 30px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .data-list::-webkit-scrollbar {
            width: 6px;
        }

        .data-list::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .data-list::-webkit-scrollbar-thumb {
            background: #e1652f;
            border-radius: 3px;
        }

        .data-item {
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #e1652f;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
        }

        .data-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .data-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(225, 101, 47, 0.12);
        }

        .data-item:hover::before {
            transform: translateX(100%);
        }

        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .data-item-title {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .data-item-date {
            color: #999;
            font-size: 12px;
        }

        .data-item-content {
            color: #555;
            line-height: 1.7;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .data-item-content p {
            margin-bottom: 4px;
        }

        .data-actions {
            display: flex;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            min-width: auto;
            flex: none;
        }

        .empty-state {
            text-align: center;
            color: #bbb;
            padding: 50px 20px;
            font-style: italic;
            font-size: 15px;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #e1652f 0%, #ff8a4c 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.4em;
            font-weight: 600;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            transition: opacity 0.3s ease;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 30px;
        }

        .code-container {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-container::-webkit-scrollbar {
            width: 6px;
        }

        .code-container::-webkit-scrollbar-track {
            background: #333;
            border-radius: 3px;
        }

        .code-container::-webkit-scrollbar-thumb {
            background: #e1652f;
            border-radius: 3px;
        }

        .code-container pre {
            margin: 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 登录页面样式 */
        .login-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #e1652f, #ff8a4c);
        }

        .login-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8em;
            font-weight: 700;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }

        .login-box .btn {
            width: 100%;
            margin-top: 10px;
        }

        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
        }

        .user-bar .user-name {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            padding: 6px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #e1652f;
            border-color: #e1652f;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                margin-top: 70px;
            }

            .header {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .tab-nav {
                flex-wrap: wrap;
            }

            .tab-button {
                flex: 1 1 50%;
                padding: 14px 8px;
                font-size: 13px;
            }

            .tab-content {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                flex: none;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 15px;
            }

            .stat-item {
                flex: 1 1 40%;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }

            .modal-header {
                padding: 15px 20px;
            }

            .modal-body {
                padding: 20px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .login-box {
                padding: 30px 20px;
            }
        }

        /* 富文本编辑器样式 */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 10px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .editor-toolbar button {
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.2s ease;
            min-width: 32px;
        }

        .editor-toolbar button:hover {
            background: #e1652f;
            color: white;
            border-color: #e1652f;
        }

        .editor-toolbar button:active {
            transform: scale(0.95);
        }

        .editor-content {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            font-size: 14px;
            line-height: 1.8;
            outline: none;
            background: white;
            overflow-y: auto;
        }

        .editor-content:focus {
            border-color: #e1652f;
            box-shadow: 0 0 0 3px rgba(225, 101, 47, 0.12);
        }

        .editor-content:empty::before {
            content: '在此输入博客正文内容...';
            color: #bbb;
        }

        .blog-item-edit-btn {
            background: linear-gradient(135deg, #ff9800 0%, #ffb74d 100%) !important;
            color: white !important;
            box-shadow: 0 2px 6px rgba(255, 152, 0, 0.2);
        }
    </style>
    <!-- 深色模式：防闪脚本 + 主题样式 -->
    <script>(function(){try{var t=localStorage.getItem('site-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="css/darkmode.css">
</head>

<body>

    <!-- 共享导航栏 -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/amazeui.min.js"></script>
    <script src="js/header.js"></script>

    <!-- 登录页面 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>🔐 管理员登录</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </div>
    </div>

    <!-- 管理主界面 -->
    <div id="adminPanel" class="container" style="display: none;">
        <div class="user-bar">
            <span class="user-name" id="userDisplay"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
        <div class="header">
            <h1>📝 内容管理系统</h1>
            <p>统一管理工作、经历、美食、琐碎内容（数据已同步到后端数据库）</p>
        </div>
        <!-- AI 站点周报 -->
        <div class="ai-weekly-card" id="aiWeeklyCard" style="display:none">
            <div class="ai-weekly-head">🍊 小橙 · AI 站点周报</div>
            <div class="ai-weekly-text" id="aiWeeklyText">正在生成本周小结…</div>
            <div class="ai-weekly-stats" id="aiWeeklyStats"></div>
        </div>
        <div class="main-card">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="workCount">0</div>
                    <div class="stat-label">工作记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="experienceCount">0</div>
                    <div class="stat-label">经历记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="foodCount">0</div>
                    <div class="stat-label">美食记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="suosuiCount">0</div>
                    <div class="stat-label">琐碎记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="updateCount">0</div>
                    <div class="stat-label">更新记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="blogCount">0</div>
                    <div class="stat-label">博客文章</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="gameCount">0</div>
                    <div class="stat-label">游戏记录</div>
                </div>
<div class="stat-item">
<div class="stat-number" id="wechatCount">0</div>
<div class="stat-label">朋友圈</div>
</div>
<div class="stat-item">
<div class="stat-number" id="galleryCount">0</div>
<div class="stat-label">照片墙</div>
</div>
</div>
            <div class="tab-nav">
                <button class="tab-button active" onclick="switchTab('work')">💼 工作管理</button>
                <button class="tab-button" onclick="switchTab('experience')">🎯 经历管理</button>
                <button class="tab-button" onclick="switchTab('food')">🍽️ 美食管理</button>
                <button class="tab-button" onclick="switchTab('suosui')">📝 琐碎管理</button>
                <button class="tab-button" onclick="switchTab('update')">📢 更新管理</button>
                <button class="tab-button" onclick="switchTab('blog')">📚 博客管理</button>
                <button class="tab-button" onclick="switchTab('game')">🎮 游戏管理</button>
                <button class="tab-button" onclick="switchTab('wechat')">💬 朋友圈管理</button>
                <button class="tab-button" onclick="switchTab('gallery')">📷 照片墙管理</button>
            </div>
            <div id="work-tab" class="tab-content active">
                <form id="workForm">
                    <div class="form-group"><label>工作标题</label><input type="text" id="workTitle" placeholder="留空自动生成（如：记录工作-1）"
                            required></div>
                    <div class="form-row">
                        <div class="form-group"><label>时间</label><input type="text" id="workTime"
                                placeholder="例如：2021.8.17" required></div>
                        <div class="form-group"><label>地点/描述</label><input type="text" id="workLocation"
                                placeholder="宁夏-银川"></div>
                    </div>
                    <div class="form-group"><label>详细内容</label><textarea id="workContent" rows="3"
                            placeholder="详细描述工作内容"></textarea>
                        <div class="ai-write-bar" data-target="workContent" data-type="work" data-title="workTitle">
                            <button type="button" class="ai-write-btn" data-action="polish">✨ AI 润色</button>
                            <button type="button" class="ai-write-btn" data-action="expand">📝 AI 扩写</button>
                            <button type="button" class="ai-write-btn" data-action="draft">🪄 AI 起草</button>

        /**
         * 获取带认证头的 fetch 配置
         */
        function authFetchOptions(method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            if (authToken) {
                options.headers['Authorization'] = 'Bearer ' + authToken;
            }
            if (body) {
                options.body = JSON.stringify(body);
            }
            return options;
        }

        /**
         * 统一的 API 请求函数，自动处理 401 跳转登录
         */
        async function apiRequest(url, method = 'GET', body = null) {
            const options = authFetchOptions(method, body);
            const res = await fetch(apiUrl(url), options);
            if (res.status === 401) {
                // token 失效，跳转登录
                showLoginPanel();
                throw new Error('认证已过期，请重新登录');
            }
            const result = await res.json();
            if (!res.ok) {
                throw new Error(result.error || '请求失败');
            }
            return result;
        }

        /**
         * 检查登录状态
         */
        async function checkAuth() {
            if (!authToken) {
                showLoginPanel();
                return;
            }
            try {
                const result = await apiRequest('/api/auth/verify');
                if (result.valid) {
                    showAdminPanel(result.user.username);
                    await loadAllData();
                } else {
                    showLoginPanel();
                }
            } catch (error) {
                console.error('验证失败:', error);
                showLoginPanel();
            }
        }

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;

        /**
         * 编辑记录 —— 将数据填充到表单，切换为编辑模式
         */
        function editItem(type, id) {
            const item = data[type].find(it => it.id === id);
            if (!item) return;
            editingIds[type] = id;
            const config = formFieldConfig[type];
            if (!config) return;

            // 遍历字段配置，将数据填充到对应表单元素
            Object.keys(config.fields).forEach(key => {
                const fieldDef = config.fields[key];
                if (typeof fieldDef === 'string') {
                    // 简单字段：fieldDef 就是元素 id
                    const el = document.getElementById(fieldDef);
                    if (el) el.value = item[key] || '';
                } else if (typeof fieldDef === 'object') {
                    // 复合字段：{ el: '元素id', type: 'imagelinks' | 'single' }
                    const el = document.getElementById(fieldDef.el);
                    if (!el) return;
                    if (fieldDef.type === 'imagelinks') {
                        // 图片链接数组 → 每行一个
                        el.value = (item.images || []).join('\n');
                    } else if (fieldDef.type === 'single') {
                        // 单个图片链接
                        el.value = (item.images && item.images[0]) || '';
                    } else if (fieldDef.type === 'comments') {
                        // 评论数组 → 每行一条评论
                        var comments = item.tags || [];
                        el.value = comments.map(function(c) {
                            if (c.replyTo) {
                                return c.user + '回复' + c.replyTo + ':' + c.text;
                            }
                            return c.user + ':' + c.text;
                        }).join('\n');
                    }
                }
            });

            // 修改提交按钮文案
            const form = document.getElementById(config.formId);
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) submitBtn.textContent = config.editBtnText;

            // 添加取消编辑按钮（如果还没有）
            let cancelBtn = form.querySelector('.cancel-edit-btn');
            if (!cancelBtn) {
                cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'btn btn-danger cancel-edit-btn';
                cancelBtn.textContent = '取消编辑';
                cancelBtn.onclick = function() { cancelEdit(type); };
                form.querySelector('.btn-group').appendChild(cancelBtn);
            }

            // 滚动到表单
            form.scrollIntoView({ behavior: 'smooth' });
            showNotification('已加载记录内容，修改后点击「保存修改」', 'info');
        }

        /**
         * 取消编辑，恢复为新建模式
         */
        function cancelEdit(type) {
            editingIds[type] = null;
            const config = formFieldConfig[type];
            if (!config) return;
            const form = document.getElementById(config.formId);
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) submitBtn.textContent = config.submitBtnText;
            const cancelBtn = form.querySelector('.cancel-edit-btn');
            if (cancelBtn) cancelBtn.remove();
            form.reset();
            setFormDefaults(type);
        }

        /**
         * 删除记录 —— 调用后端 API
         */
        async function deleteItem(type, id) {
            if (!confirm('确定要删除这条记录吗？此操作不可恢复！')) return;
            try {
                await apiRequest('/api/content/' + type + '/' + id, 'DELETE');
                data[type] = data[type].filter(item => item.id !== id);
                renderList(type);
                updateStats();
                showNotification('记录删除成功！', 'success');
            } catch (error) {
                showNotification('删除失败：' + error.message, 'error');
            }
        }

        /**
         * 清空数据 —— 逐条删除所有记录
         */
        async function clearData(type) {
            const typeNames = { 'work': '工作', 'experience': '经历', 'food': '美食', 'suosui': '琐碎', 'update': '更新', 'blog': '博客', 'game': '游戏', 'wechat': '朋友圈', 'gallery': '照片墙' };
            if (!confirm('确定要清空所有' + typeNames[type] + '数据吗？此操作不可恢复！')) return;
            try {
                const promises = data[type].map(item =>
                    apiRequest('/api/content/' + type + '/' + item.id, 'DELETE')
                );
                await Promise.all(promises);
                data[type] = [];
                renderList(type);
                updateStats();
                showNotification(typeNames[type] + '数据已全部清空！', 'success');
            } catch (error) {
                showNotification('清空失败：' + error.message, 'error');
                await loadAllData();
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 3000;
                padding: 14px 22px; border-radius: 8px; color: white;
                font-size: 14px; font-weight: 500;
                background: ${type === 'success' ? '#4caf50' : type === 'error' ? '#f44336' : '#e1652f'};
                box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.style.transform = 'translateX(0)', 100);
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        function parseImageLinks(imageText) {
            if (!imageText || !imageText.trim()) return [];
            return imageText.split('\n')
                .map(link => link.trim())
                .filter(link => link.length > 0);
        }

        // ========== 表单提交（调用后端 API） ==========

        // 自动生成标题编码配置
        const autoTitleConfig = {
            work: { prefix: '工作记录-', fieldId: 'workTitle' },
            experience: { prefix: '经历记录-', fieldId: 'experienceTitle' },
            food: { prefix: '美食记录-', fieldId: 'foodTitle' },
            suosui: { prefix: '琐碎记录-', fieldId: 'suosuiTitle' }
        };

        /**
         * 自动生成标题编码
         * @param {string} type - 数据类型 (work/experience/food/suosui)
         * @returns {string} 生成的标题，如 "工作记录-13"、"经历记录-3"
         */
        function generateAutoTitle(type) {
            const config = autoTitleConfig[type];
            if (!config) return '';
            
            // 获取当前数据的最大编号
            let maxNum = 0;
            const items = data[type] || [];
            items.forEach(function(item) {
                const match = item.title && item.title.match(new RegExp('^' + config.prefix + '(\\d+)$'));
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num > maxNum) maxNum = num;
                }
            });
            
            return config.prefix + (maxNum + 1);
        }

        /**
         * 获取表单标题值（如果为空则自动生成）
         */
        function getFormTitle(type, inputEl) {
            const value = inputEl.value.trim();
            if (value) return value; // 用户手动填写了则使用用户填写的
            return generateAutoTitle(type); // 空则自动生成
        }

                location: document.getElementById('workLocation').value,
                content: document.getElementById('workContent').value,
                images: parseImageLinks(document.getElementById('workImages').value)
            };

                if (editingIds.work) {
                    // 编辑模式
                    const updated = await apiRequest('/api/content/work/' + editingIds.work, 'PUT', body);
                    const idx = data.work.findIndex(it => it.id === editingIds.work);
                    if (idx !== -1) data.work[idx] = updated;
                    cancelEdit('work');
                    showNotification('工作记录修改成功！');
                } else {
                    // 新建模式
                    const created = await apiRequest('/api/content/work', 'POST', body);
                    data.work.unshift(created);
                    this.reset();
                    setFormDefaults('work');
                    showNotification('工作记录添加成功！');

                renderList('work');
                updateStats();

                showNotification('操作失败：' + error.message, 'error');

            if (!commentsText || !commentsText.trim()) return [];
            return commentsText.split('\n')

                .filter(line => line.length > 0)
                .map(line => {
                    // 支持格式：用户名回复用户名:评论内容 或 用户名:评论内容
                    var replyMatch = line.match(/^(.+?)回复(.+?):(.+)$/);
                    if (replyMatch) {
                        return { user: replyMatch[1].trim(), replyTo: replyMatch[2].trim(), text: replyMatch[3].trim() };
                    }
                    var match = line.match(/^(.+?):(.+)$/);
                    if (match) {
                        return { user: match[1].trim(), text: match[2].trim() };
                    }
                    return { user: '匿名', text: line };
                });
        }

        // ========== 生成代码功能（保留原功能） ==========

        function generateCode(type) {
            if (data[type].length === 0) {
                showNotification('没有数据可以生成代码！', 'error');
                return;
            }
            const processedData = data[type].map(item => {
                const numberMatch = item.title.match(/(\d+)/);
                const id = numberMatch ? parseInt(numberMatch[1]) : Math.floor(Math.random() * 1000) + 1;
                if (type === 'suosui') {
                    return {
                        id: id,
                        title: item.title,
                        subtitle: item.subtitle || "程宝vlog",
                        description: item.content || item.description || "程宝vlog.part2",
                        videoUrl: item.videoUrl || "//player.bilibili.com/player.html?isOutside=true&aid=336426195&bvid=BV1SR4y1j7i2&cid=218963994&page=1",
                        tags: generateRandomTags(),
                        date: item.date
                    };
                } else if (type === 'update') {
                    return {
                        id: id,
                        title: item.title,
                        date: item.date || item.time || "",
                        category: item.location || "",
                        content: item.content || ""
                    };
                } else if (type === 'blog') {
                    return {
                        id: id,
                        title: item.title,
                        date: item.date || "",
                        location: item.location || "",
                        description: (item.images && item.images[0]) || "",
                        tags: item.tags || [],
                        content: item.content || ""
                    };
                } else if (type === 'game') {
                    return {
                        id: id,
                        title: item.title,
                        url: item.location || "",
                        icon: (item.images && item.images[0]) || "",
                        description: item.content || ""
                    };
                } else if (type === 'wechat') {
                    return {
                        id: id,
                        title: item.title,
                        time: item.time || "",
                        date: item.date || "",
                        content: item.content || "",
                        images: item.images || [],
                        likes: item.subtitle ? item.subtitle.split(',').map(s => s.trim()).filter(s => s) : [],
                        comments: item.tags || []
                    };
                } else {
                    return {
                        id: id,
                        title: item.title,
                        time: item.time,
                        location: item.location || item.content || "记录简历照片，随取随用",
                        images: item.images || [],
                        content: item.content || item.location || "记录简历照片，随取随用"
                    };
                }
            });
            const jsonCode = formatJsonCustom(processedData, type);
            document.getElementById('generatedCode').textContent = jsonCode;
            document.getElementById('codeModal').style.display = 'block';
            showNotification(`已生成${data[type].length}条${getTypeName(type)}记录的JSON代码！`, 'success');
        }

        function formatJsonCustom(data, type) {
            let result = '';
            data.forEach((item, index) => {
                result += '{\n';
                result += `    id: ${item.id},\n`;
                result += `    title: "${item.title}",\n`;
                if (type === 'suosui') {
                    result += `    subtitle: "${item.subtitle}",\n`;
                    result += `    description: "${item.description}",\n`;
                    result += `    videoUrl: "${item.videoUrl}",\n`;
                    if (item.tags && item.tags.length > 0) {
                        result += '    tags: [';
                        item.tags.forEach((tag, tagIndex) => {
                            const comma = tagIndex < item.tags.length - 1 ? ', ' : '';
                            result += `"${tag}"${comma}`;
                        });
                        result += '],\n';
                    } else {
                        const randomTags = generateRandomTags();
                        result += `    tags: ["${randomTags.join('", "')}"],\n`;
                    }
                    result += `    date: "${item.date}"\n`;
                } else if (type === 'update') {
                    result += `    date: "${item.date}",\n`;
                    result += `    category: "${item.category}",\n`;
                    result += `    content: "${item.content}"\n`;
                } else if (type === 'blog') {
                    result += `    date: "${item.date}",\n`;
                    result += `    location: "${item.location}",\n`;
                    result += `    description: "${item.description}",\n`;
                    result += '    tags: [';
                    if (item.tags && item.tags.length > 0) {
                        item.tags.forEach((tag, tagIndex) => {
                            const comma = tagIndex < item.tags.length - 1 ? ', ' : '';
                            result += `"${tag}"${comma}`;
                        });
                    }
                    result += '],\n';
                    result += `    content: "${item.content}"\n`;
                } else if (type === 'game') {
                    result += `    url: "${item.url}",\n`;
                    result += `    icon: "${item.icon}",\n`;
                    result += `    description: "${item.description}"\n`;
                } else if (type === 'wechat') {
                    result += `    time: "${item.time}",\n`;
                    result += `    date: "${item.date}",\n`;
                    result += `    content: "${item.content}",\n`;
                    if (item.images && item.images.length > 0) {
                        result += '    images: [\n';
                        item.images.forEach((img, imgIndex) => {
                            const comma = imgIndex < item.images.length - 1 ? ',' : '';
                            result += `        "${img}"${comma}\n`;
                        });
                        result += '    ],\n';
                    } else {
                        result += '    images: [],\n';
                    }
                    result += '    likes: [';
                    if (item.likes && item.likes.length > 0) {
                        item.likes.forEach((like, likeIndex) => {
                            const comma = likeIndex < item.likes.length - 1 ? ', ' : '';
                            result += `"${like}"${comma}`;
                        });
                    }
                    result += '],\n';
                    result += '    comments: [\n';
                    if (item.comments && item.comments.length > 0) {
                        item.comments.forEach((c, cIndex) => {
                            const comma = cIndex < item.comments.length - 1 ? ',' : '';
                            if (c.replyTo) {
                                result += `        { user: "${c.user}", replyTo: "${c.replyTo}", text: "${c.text}" }${comma}\n`;
                            } else {
                                result += `        { user: "${c.user}", text: "${c.text}" }${comma}\n`;
                            }
                        });
                    }
                    result += '    ]\n';
                } else {
                    result += `    time: "${item.time}",\n`;
                    result += `    location: "${item.location}",\n`;
                    if (item.images && item.images.length > 0) {
                        result += '    images: [\n';
                        item.images.forEach((img, imgIndex) => {
                            const comma = imgIndex < item.images.length - 1 ? ',' : '';
                            result += `        "${img}"${comma}\n`;
                        });
                        result += '    ],\n';
                    } else {
                        result += '    images: [],\n';
                    }
                    result += `    content: "${item.content}"\n`;
                }
                result += '},\n';
                if (index < data.length - 1) {
                    result += '\n';
                }
            });
            return result;
        }

        function generateRandomTags() {
            const allTags = [
                "回忆", "美好", "生活", "感悟",
                "时光", "温暖", "快乐", "成长",
                "梦想", "希望", "友情", "爱情",
                "家庭", "旅行", "美食", "音乐",
                "电影", "读书", "运动", "学习",
                "工作", "思考", "感恩", "珍惜",
                "青春", "回味", "岁月", "故事",
                "心情", "日常", "记录", "分享"
            ];
            const shuffled = [...allTags].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 2);
        }

        function getTypeName(type) {
            const typeNames = { 'work': '工作', 'experience': '经历', 'food': '美食', 'suosui': '琐碎', 'update': '更新', 'blog': '博客', 'game': '游戏', 'wechat': '朋友圈', 'gallery': '照片墙' };
            return typeNames[type] || type;
        }

        function copyCode() {
            const codeElement = document.getElementById('generatedCode');
            const text = codeElement.textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('代码已复制到剪贴板！', 'success');
                }).catch(() => {
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showNotification('代码已复制到剪贴板！', 'success');
            } catch (err) {
                showNotification('复制失败，请手动复制代码！', 'error');
            }
            document.body.removeChild(textArea);
        }

        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('codeModal');
            if (event.target === modal) {
                closeCodeModal();
            }
        }

        // ==================== AI 自动标签 / 摘要（博客发布）====================
        // 走后端代理 /api/admin/ai/meta（需登录），从标题 + 正文纯文本一键生成
        async function aiGenerateMeta(action) {
            if (!authToken) { showNotification('请先登录，再使用 AI 生成～', 'error'); return; }
            const title = document.getElementById('blogTitle').value.trim();
            const contentEl = document.getElementById('blogContent');
            const text = (contentEl ? (contentEl.innerText || contentEl.textContent || '') : '').trim();
            if (!title && !text) { showNotification('请先填写标题或正文，AI 才能生成～', 'error'); return; }

            const btn = document.getElementById(action === 'tags' ? 'aiTagsBtn' : 'aiDescBtn');
            const original = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ AI 生成中…';
            try {
                const res = await fetch(apiUrl('/api/admin/ai/meta'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ action: action, title: title, text: text })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'AI 服务暂时不可用，请稍后再试');
                if (action === 'tags') {
                    document.getElementById('blogTags').value = result.tags.join(', ');
                    showNotification('标签已生成，可自行增删～', 'success');
                } else {
                    document.getElementById('blogDescription').value = result.desc;
                    showNotification('摘要已生成，可自行修改～', 'success');
                }
            } catch (err) {
                showNotification('✨ ' + ((err && err.message) || 'AI 生成失败，请稍后再试'), 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        }

        // ==================== AI 站点周报 ====================
        // 登录后加载 /api/admin/ai/weekly，失败静默隐藏（不打扰后台使用）
        async function loadAiWeeklyReport() {
            if (!authToken) return;
            const card = document.getElementById('aiWeeklyCard');
            const textEl = document.getElementById('aiWeeklyText');
            const statsEl = document.getElementById('aiWeeklyStats');
            if (!card || !textEl) return;
            card.style.display = 'block';
            textEl.textContent = '正在生成本周小结…';
            statsEl.textContent = '';
            try {
                const res = await fetch(apiUrl('/api/admin/ai/weekly'), {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'AI 服务暂时不可用');
                textEl.textContent = result.text;
                const s = result.stats || {};
                statsEl.textContent = '本周发布 ' + (s.contents || 0) + ' 条 · PV ' + (s.pv || 0)
                    + ' · UV ' + (s.uv || 0) + ' · 弹幕 ' + (s.danmaku || 0);
            } catch (err) {
                card.style.display = 'none';
            }
        }

        // ========== 页面初始化 ==========
        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();
        });
    </script>
<script>
    // ==================== AI 帮写（润色 / 扩写 / 起草）====================
    // 走后端代理 /api/admin/ai/write（需登录），密钥存在 Cloudflare 环境变量，不进浏览器。
    document.addEventListener('click', async function (e) {
        const btn = e.target.closest('.ai-write-btn');
        if (!btn) return;
        const bar = btn.closest('.ai-write-bar');
        const ta = document.getElementById(bar.dataset.target);
        if (!ta) return;

        // 未登录先提示（与页面其他接口的鉴权逻辑一致）
        if (!authToken) {
            alert('请先登录，再使用 AI 帮写～');
            return;
        }

        const action = btn.dataset.action;
        const text = ta.value.trim();
        const titleInput = bar.dataset.title ? document.getElementById(bar.dataset.title) : null;
        const title = titleInput ? titleInput.value.trim() : '';

        if (action === 'draft') {
            if (!title && !text) { alert('请先填写标题，AI 根据主题帮你起草～'); return; }
        } else if (!text) {
            alert(action === 'polish' ? '请先输入一些内容，再让 AI 润色～' : '请先输入一些内容，再让 AI 扩写～');
            return;
        }

        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = '⏳ AI 写作中…';
        try {
            const res = await fetch(apiUrl('/api/admin/ai/write'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                body: JSON.stringify({
                    action: action,
                    type: bar.dataset.type,
                    text: action === 'draft' ? (title || text) : text
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'AI 服务暂时不可用，请稍后再试');

            if (action === 'draft') {
                ta.value = data.text;
            } else if (action === 'expand') {
                if (confirm('AI 扩写完成，追加到已有内容后面吗？（取消则不改动）')) {
                    ta.value = text + '\n\n' + data.text;
                }
            } else {
                if (confirm('AI 润色完成，替换输入框里的内容吗？（取消则不改动）')) {
                    ta.value = data.text;
                }
            }
        } catch (err) {
            alert('✨ ' + ((err && err.message) || 'AI 帮写失败，请稍后再试'));
        } finally {
            btn.disabled = false;
            btn.textContent = original;
        }
    });
</script>

<script>
    // ==================== 图片本地上传（R2）+ 回显预览 ====================
    // 保留原有「手动填链接」模式：上传成功后自动把 R2 链接追加进输入框，输入框内任意链接都会回显缩略图。
    (function () {
        // 注入样式
        var css = document.createElement('style');
        css.textContent = [
            '.cm-upload-toolbar{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}',
            '.cm-upload-btn{padding:6px 14px;font-size:13px;border:1px dashed #e1652f;color:#e1652f;',
            'background:rgba(225,101,47,.06);border-radius:8px;cursor:pointer;transition:all .3s;}',
            '.cm-upload-btn:hover{background:#e1652f;color:#fff;}',
            '.cm-upload-btn.uploading{opacity:.6;pointer-events:none;}',
            '.cm-upload-hint{font-size:12px;color:#999;}',
            '.cm-upload-previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}',
            '.cm-upload-previews:empty{display:none;}',
            '.cm-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;',
            'box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;}',
            '.cm-thumb img{width:100%;height:100%;object-fit:cover;display:block;}',
            '.cm-thumb .del{position:absolute;top:0;right:0;width:18px;height:18px;line-height:16px;',
            'text-align:center;font-size:12px;color:#fff;background:rgba(0,0,0,.55);border-radius:0 0 0 6px;}'
        ].join('');
        document.head.appendChild(css);

        // 六个模块的图片字段
        var FIELDS = [
            { el: 'workImages', multi: true },        // 工作管理
            { el: 'experienceImages', multi: true },  // 经历管理
            { el: 'foodImages', multi: true },        // 美食管理
            { el: 'gameIcon', multi: false },         // 游戏管理（单个图标）
            { el: 'wechatImages', multi: true },      // 朋友圈管理
            { el: 'galleryImages', multi: true }      // 照片墙管理
        ];
        var HINT_DEFAULT = '支持 jpg/png/gif/webp，单张 ≤10MB，上传后自动填入链接，点击缩略图可删除';

        function getUrls(field) {
            var v = field.el.value || '';
            return field.multi
                ? v.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
                : (v.trim() ? [v.trim()] : []);
        }

        function setUrls(field, urls) {
            field.el.value = field.multi ? urls.join('\n') : (urls[0] || '');
        }

        function renderPreviews(field) {
            var urls = getUrls(field);
            field.previews.innerHTML = urls.map(function (u, i) {
                return '<div class="cm-thumb" data-i="' + i + '" title="点击删除该链接">'
                    + '<img src="' + u + '" loading="lazy" alt="">'
                    + '<span class="del">×</span></div>';
            }).join('');
            Array.prototype.forEach.call(field.previews.querySelectorAll('.cm-thumb'), function (thumb) {
                thumb.addEventListener('click', function () {
                    if (!confirm('确定删除这张图片的链接吗？（仅从表单移除，不删除 R2 文件）')) return;
                    var list = getUrls(field);
                    list.splice(parseInt(thumb.dataset.i, 10), 1);
                    setUrls(field, list);
                    renderPreviews(field);
                });
            });
        }

        // ========== 图片压缩函数 ==========
        /**
         * 压缩图片文件
         * @param {File} file - 原始图片文件
         * @param {Object} options - 压缩选项
         * @param {number} options.maxWidth - 最大宽度，默认 1920
         * @param {number} options.maxHeight - 最大高度，默认 1080
         * @param {number} options.quality - 压缩质量 0-1，默认 0.8
         * @param {number} options.maxSizeKB - 最大文件大小(KB)，超过会继续降低质量，默认 500
         * @returns {Promise<File>} 压缩后的图片文件
         */
        function compressImage(file, options) {
            options = Object.assign({
                maxWidth: 1920,
                maxHeight: 1080,
                quality: 0.8,
                maxSizeKB: 500
            }, options);

            return new Promise(function (resolve, reject) {
                // 如果文件已经很小（<100KB），直接返回原文件
                if (file.size < 100 * 1024) {
                    resolve(file);
                    return;
                }

                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function () {
                        var canvas = document.createElement('canvas');
                        var ctx = canvas.getContext('2d');

                        // 计算压缩后的尺寸（保持宽高比）
                        var width = img.width;
                        var height = img.height;

                        if (width > options.maxWidth || height > options.maxHeight) {
                            var ratio = Math.min(options.maxWidth / width, options.maxHeight / height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }

                        canvas.width = width;
                        canvas.height = height;

                        // 绘制图片到 canvas
                        ctx.drawImage(img, 0, 0, width, height);

                        // 转换为 blob
                        canvas.toBlob(function (blob) {
                            if (!blob) {
                                resolve(file); // 压缩失败则使用原图
                                return;
                            }

                            // 如果压缩后仍然太大，继续降低质量
                            if (blob.size > options.maxSizeKB * 1024 && options.quality > 0.3) {
                                compressImage(file, Object.assign({}, options, {
                                    quality: options.quality - 0.1
                                })).then(resolve).catch(reject);
                                return;
                            }

                            // 创建新的 File 对象
                            var compressedFile = new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });

                            console.log('图片压缩完成:', file.name, 
                                (file.size / 1024).toFixed(1) + 'KB -> ' + 
                                (compressedFile.size / 1024).toFixed(1) + 'KB');
                            resolve(compressedFile);
                        }, 'image/jpeg', options.quality);
                    };
                    img.onerror = function () { resolve(file); };
                    img.src = e.target.result;
                };
                reader.onerror = function () { resolve(file); };
                reader.readAsDataURL(file);
            });
        }

        // 批量压缩图片
        async function compressImages(files, options) {
            var results = [];
            for (var i = 0; i < files.length; i++) {
                results.push(await compressImage(files[i], options));
            }
            return results;
        }

        function doUpload(field, files) {
            field.btn.classList.add('uploading');
            field.hint.textContent = '压缩处理中...';

            // 先压缩图片，再上传
            compressImages(files, {
                maxWidth: 1920,
                maxHeight: 1080,
                quality: 0.8,
                maxSizeKB: 500
            }).then(function (compressedFiles) {
                field.hint.textContent = '上传中...';
                var form = new FormData();
                if (field.multi) {
                    compressedFiles.forEach(function (file) { form.append('images', file); });
                } else {
                    form.append('image', compressedFiles[0]);
                }
                return fetch(apiUrl(field.multi ? '/api/upload/multiple' : '/api/upload'), {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken },
                    body: form
                });
            }).then(function (res) {
                return res.json().then(function (data) { return { ok: res.ok, data: data }; });
            }).then(function (r) {
                if (!r.ok) throw new Error(r.data.error || '上传失败');
                var urls = getUrls(field);
                var added = field.multi
                    ? (r.data.files || []).map(function (x) { return x.url; })
                    : [r.data.url];
                added.forEach(function (u) { if (urls.indexOf(u) === -1) urls.push(u); });
                setUrls(field, urls);
                renderPreviews(field);
                field.hint.textContent = '上传成功 ' + added.length + ' 张';
            }).catch(function (err) {
                var msg = (err && err.message) || '上传失败';
                field.hint.textContent = msg;
                if (String(msg).indexOf('令牌') !== -1) alert('登录已过期，请刷新页面重新登录');
            }).finally(function () {
                field.btn.classList.remove('uploading');
                setTimeout(function () { field.hint.textContent = HINT_DEFAULT; }, 4000);
            });
        }

        FIELDS.forEach(function (f) {
            var el = document.getElementById(f.el);
            if (!el) return;
            f.el = el;

            // 拦截程序化赋值（点「编辑」回填数据时同步刷新缩略图预览）
            var valueDesc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value');
            if (valueDesc && valueDesc.set) {
                Object.defineProperty(el, 'value', {
                    get: function () { return valueDesc.get.call(el); },
                    set: function (v) { valueDesc.set.call(el, v); renderPreviews(f); }
                });
            }

            var input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            if (f.multi) input.multiple = true;
            input.style.display = 'none';

            f.btn = document.createElement('button');
            f.btn.type = 'button';
            f.btn.className = 'cm-upload-btn';
            f.btn.textContent = f.multi ? '📷 本地上传（可多选）' : '📷 上传图标';

            f.hint = document.createElement('span');
            f.hint.className = 'cm-upload-hint';
            f.hint.textContent = HINT_DEFAULT;

            f.previews = document.createElement('div');
            f.previews.className = 'cm-upload-previews';

            var ui = document.createElement('div');
            ui.appendChild(input);
            ui.appendChild(f.btn);
            ui.appendChild(f.hint);
            ui.appendChild(f.previews);
            el.parentNode.appendChild(ui); // 追加到同一 form-group 内

            f.btn.addEventListener('click', function () { input.click(); });
            input.addEventListener('change', function () {
                var files = Array.prototype.slice.call(input.files || []);
                input.value = '';
                if (!files.length) return;
                if (f.multi) files = files.slice(0, 20);
                doUpload(f, files);
            });
            el.addEventListener('input', function () { renderPreviews(f); });
            renderPreviews(f);
        });
    })();
</script>
