<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理后台系统 - 浩天的个人站</title>
    <link rel="icon" type="image/png" href="images/i/favicon.png">
    <link rel="stylesheet" href="assets/css/amazeui.min.css">
    <link rel="stylesheet" href="css/public.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto 0;
            padding: 0 15px;
        }

        .header {
            background: linear-gradient(135deg, #e1652f 0%, #ff8a4c 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(225, 101, 47, 0.25);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
        }

        .header:hover::before {
            transform: translateX(100%);
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .main-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
            padding: 20px 15px;
            border-bottom: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-3px);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #e1652f;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .tab-nav {
            display: flex;
            background: #fafafa;
            border-bottom: 2px solid #eee;
        }

        .tab-button {
            flex: 1;
            padding: 18px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            background: white;
            color: #e1652f;
            border-bottom: 3px solid #e1652f;
            font-weight: 600;
        }

        .tab-button:hover {
            background: #f0f0f0;
            color: #e1652f;
        }

        .tab-button.active:hover {
            background: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e1652f;
            box-shadow: 0 0 0 3px rgba(225, 101, 47, 0.12);
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex: 1;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e1652f 0%, #ff8a4c 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(225, 101, 47, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #ef5350 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(244, 67, 54, 0.2);
        }

        .btn-info {
            background: linear-gradient(135deg, #2196f3 0%, #42a5f5 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(33, 150, 243, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .data-list {
            margin-top: 30px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .data-list::-webkit-scrollbar {
            width: 6px;
        }

        .data-list::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .data-list::-webkit-scrollbar-thumb {
            background: #e1652f;
            border-radius: 3px;
        }

        .data-item {
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #e1652f;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
        }

        .data-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .data-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(225, 101, 47, 0.12);
        }

        .data-item:hover::before {
            transform: translateX(100%);
        }

        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .data-item-title {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .data-item-date {
            color: #999;
            font-size: 12px;
        }

        .data-item-content {
            color: #555;
            line-height: 1.7;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .data-item-content p {
            margin-bottom: 4px;
        }

        .data-actions {
            display: flex;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            min-width: auto;
            flex: none;
        }

        .empty-state {
            text-align: center;
            color: #bbb;
            padding: 50px 20px;
            font-style: italic;
            font-size: 15px;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #e1652f 0%, #ff8a4c 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.4em;
            font-weight: 600;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            transition: opacity 0.3s ease;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 30px;
        }

        .code-container {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-container::-webkit-scrollbar {
            width: 6px;
        }

        .code-container::-webkit-scrollbar-track {
            background: #333;
            border-radius: 3px;
        }

        .code-container::-webkit-scrollbar-thumb {
            background: #e1652f;
            border-radius: 3px;
        }

        .code-container pre {
            margin: 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 登录页面样式 */
        .login-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #e1652f, #ff8a4c);
        }

        .login-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8em;
            font-weight: 700;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }

        .login-box .btn {
            width: 100%;
            margin-top: 10px;
        }

        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            gap: 15px;
        }

        .user-bar .user-name {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            padding: 6px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #e1652f;
            border-color: #e1652f;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                margin-top: 70px;
            }

            .header {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .tab-nav {
                flex-wrap: wrap;
            }

            .tab-button {
                flex: 1 1 50%;
                padding: 14px 8px;
                font-size: 13px;
            }

            .tab-content {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                flex: none;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 15px;
            }

            .stat-item {
                flex: 1 1 40%;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }

            .modal-header {
                padding: 15px 20px;
            }

            .modal-body {
                padding: 20px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .login-box {
                padding: 30px 20px;
            }
        }

        /* 富文本编辑器样式 */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 10px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .editor-toolbar button {
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.2s ease;
            min-width: 32px;
        }

        .editor-toolbar button:hover {
            background: #e1652f;
            color: white;
            border-color: #e1652f;
        }

        .editor-toolbar button:active {
            transform: scale(0.95);
        }

        .editor-content {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            font-size: 14px;
            line-height: 1.8;
            outline: none;
            background: white;
            overflow-y: auto;
        }

        .editor-content:focus {
            border-color: #e1652f;
            box-shadow: 0 0 0 3px rgba(225, 101, 47, 0.12);
        }

        .editor-content:empty::before {
            content: '在此输入博客正文内容...';
            color: #bbb;
        }

        .blog-item-edit-btn {
            background: linear-gradient(135deg, #ff9800 0%, #ffb74d 100%) !important;
            color: white !important;
            box-shadow: 0 2px 6px rgba(255, 152, 0, 0.2);
        }
    </style>
</head>

<body>

    <!-- 共享导航栏 -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/amazeui.min.js"></script>
    <script src="js/header.js"></script>

    <!-- 登录页面 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>🔐 管理员登录</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </div>
    </div>

    <!-- 管理主界面 -->
    <div id="adminPanel" class="container" style="display: none;">
        <div class="user-bar">
            <span class="user-name" id="userDisplay"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
        <div class="header">
            <h1>📝 内容管理系统</h1>
            <p>统一管理工作、经历、美食、琐碎内容（数据已同步到后端数据库）</p>
        </div>
        <div class="main-card">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="workCount">0</div>
                    <div class="stat-label">工作记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="experienceCount">0</div>
                    <div class="stat-label">经历记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="foodCount">0</div>
                    <div class="stat-label">美食记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="suosuiCount">0</div>
                    <div class="stat-label">琐碎记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="updateCount">0</div>
                    <div class="stat-label">更新记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="blogCount">0</div>
                    <div class="stat-label">博客文章</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="gameCount">0</div>
                    <div class="stat-label">游戏记录</div>
                </div>
            </div>
            <div class="tab-nav">
                <button class="tab-button active" onclick="switchTab('work')">💼 工作管理</button>
                <button class="tab-button" onclick="switchTab('experience')">🎯 经历管理</button>
                <button class="tab-button" onclick="switchTab('food')">🍽️ 美食管理</button>
                <button class="tab-button" onclick="switchTab('suosui')">📝 琐碎管理</button>
                <button class="tab-button" onclick="switchTab('update')">📢 更新管理</button>
                <button class="tab-button" onclick="switchTab('blog')">📚 博客管理</button>
                <button class="tab-button" onclick="switchTab('game')">🎮 游戏管理</button>
            </div>
            <div id="work-tab" class="tab-content active">
                <form id="workForm">
                    <div class="form-group"><label>工作标题</label><input type="text" id="workTitle" placeholder="输入工作标题"
                            required></div>
                    <div class="form-row">
                        <div class="form-group"><label>时间</label><input type="text" id="workTime"
                                placeholder="例如：2021.8.17" required></div>
                        <div class="form-group"><label>地点/描述</label><input type="text" id="workLocation"
                                placeholder="宁夏-银川"></div>
                    </div>
                    <div class="form-group"><label>详细内容</label><textarea id="workContent" rows="3"
                            placeholder="详细描述工作内容"></textarea></div>
                    <div class="form-group"><label>图片链接</label><textarea id="workImages" rows="2"
                            placeholder="输入图片链接，每行一个链接，例如：&#10;images/w1.jpg&#10;images/w2.jpg&#10;images/w3.jpg"></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加工作记录</button>
                        <button type="button" class="btn btn-success" onclick="generateCode('work')">生成代码</button>
                        <button type="button" class="btn btn-danger" onclick="clearData('work')">清空数据</button>
                    </div>
                </form>
                <div class="data-list" id="workList"></div>
            </div>
            <div id="experience-tab" class="tab-content">
                <form id="experienceForm">
                    <div class="form-group"><label>经历标题</label><input type="text" id="experienceTitle"
                            placeholder="输入经历标题" required></div>
                    <div class="form-row">
                        <div class="form-group"><label>时间</label><input type="text" id="experienceTime"
                                placeholder="例如：2021.10.4" required></div>
                        <div class="form-group"><label>地点/描述</label><input type="text" id="experienceLocation"
                                placeholder="宁夏-银川"></div>
                    </div>
                    <div class="form-group"><label>详细内容</label><textarea id="experienceContent" rows="3"
                            placeholder="详细描述这次经历"></textarea></div>
                    <div class="form-group"><label>图片链接</label><textarea id="experienceImages" rows="2"
                            placeholder="输入图片链接，每行一个链接，例如：&#10;images/jd1.jpg&#10;images/jd2.jpg&#10;images/jd3.jpg"></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加经历记录</button>
                        <button type="button" class="btn btn-success" onclick="generateCode('experience')">生成代码</button>
                        <button type="button" class="btn btn-danger" onclick="clearData('experience')">清空数据</button>
                    </div>
                </form>
                <div class="data-list" id="experienceList"></div>
            </div>
            <div id="food-tab" class="tab-content">
                <form id="foodForm">
                    <div class="form-group"><label>美食标题</label><input type="text" id="foodTitle" placeholder="输入美食标题"
                            required></div>
                    <div class="form-row">
                        <div class="form-group"><label>时间</label><input type="text" id="foodTime"
                                placeholder="例如：2022.4.29" required></div>
                        <div class="form-group"><label>地点/描述</label><input type="text" id="foodLocation"
                                placeholder="宁夏-银川"></div>
                    </div>
                    <div class="form-group"><label>详细内容</label><textarea id="foodContent" rows="3"
                            placeholder="详细描述美食体验"></textarea></div>
                    <div class="form-group"><label>图片链接</label><textarea id="foodImages" rows="2"
                            placeholder="输入图片链接，每行一个链接，例如：&#10;https://i.postimg.cc/yJrMYkFG/IMG-20200819-205634.jpg&#10;https://i.postimg.cc/6qckQbhZ/2832080519158827362.jpg"></textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加美食记录</button>
                        <button type="button" class="btn btn-success" onclick="generateCode('food')">生成代码</button>
                        <button type="button" class="btn btn-danger" onclick="clearData('food')">清空数据</button>
                    </div>
                </form>
                <div class="data-list" id="foodList"></div>
            </div>
            <div id="suosui-tab" class="tab-content">
                <form id="suosuiForm">

                    <div class="btn-group">

                    <div class="form-group"><label>更新内容</label><textarea id="updateContent" rows="3"

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加更新记录</button>
                        <button type="button" class="btn btn-success" onclick="generateCode('update')">生成代码</button>

                <div class="data-list" id="updateList"></div>

                <form id="blogForm">
                    <div class="form-group"><label>博客标题</label><input type="text" id="blogTitle" placeholder="输入博客标题"
                            required></div>
                    <div class="form-row">
                        <div class="form-group"><label>日期</label><input type="text" id="blogDate"
                                placeholder="例如：2021-10-11" required></div>
                        <div class="form-group"><label>地点</label><input type="text" id="blogLocation"
                                placeholder="例如：宁夏-银川"></div>

                            placeholder="一句话描述博客内容"></div>

                            <button type="button" onclick="execEdit('justifyCenter')" title="居中">≡</button>

                        <div class="editor-content" id="blogContent" contenteditable="true"></div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加博客文章</button>
                        <button type="button" class="btn btn-success" onclick="generateCode('blog')">生成代码</button>
                        <button type="button" class="btn btn-danger" onclick="clearData('blog')">清空数据</button>

                <div class="data-list" id="blogList"></div>
            </div>
            <div id="game-tab" class="tab-content">
                <form id="gameForm">
                    <div class="form-group"><label>游戏名称</label><input type="text" id="gameTitle" placeholder="输入游戏名称，例如：超级玛丽" required></div>
                    <div class="form-row">
                        <div class="form-group"><label>游戏链接</label><input type="url" id="gameUrl" placeholder="例如：https://www.yikm.net/play?id=3501" required></div>
                        <div class="form-group"><label>图标链接</label><input type="text" id="gameIcon" placeholder="游戏图标图片链接"></div>
                    </div>
                    <div class="form-group"><label>游戏描述</label><textarea id="gameDescription" rows="2" placeholder="简要描述游戏内容"></textarea></div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">添加游戏记录</button>
                        <button type="button" class="btn btn-success" onclick="generateCode('game')">生成代码</button>
                        <button type="button" class="btn btn-danger" onclick="clearData('game')">清空数据</button>

                <div class="data-list" id="gameList"></div>

    <!-- 代码生成弹窗 -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>生成的JSON代码</h2>
                <span class="close" onclick="closeCodeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="code-container">
                    <pre id="generatedCode"></pre>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="copyCode()">复制代码</button>
                    <button class="btn btn-info" onclick="closeCodeModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/footer.js"></script>
<script src="js/api-config.js"></script>
<script>
// ========== 全局状态 ==========
        let data = { work: [], experience: [], food: [], suosui: [], update: [], blog: [], game: [] };
        let currentTab = 'work';
        let authToken = localStorage.getItem('authToken') || '';

        // 各模块编辑状态：editingIds[type] = 正在编辑的记录 id，null 表示新建模式
        let editingIds = { work: null, experience: null, food: null, suosui: null, update: null, blog: null, game: null };

        // 各模块表单字段配置（用于编辑时填充表单和提交时收集数据）
        const formFieldConfig = {
            work: {
                formId: 'workForm',
                submitBtnText: '添加工作记录',
                editBtnText: '保存修改',
                fields: {
                    title: 'workTitle',
                    time: 'workTime',
                    location: 'workLocation',
                    content: 'workContent',
                    images: { el: 'workImages', type: 'imagelinks' }
                }
            },
            experience: {
                formId: 'experienceForm',
                submitBtnText: '添加经历记录',
                editBtnText: '保存修改',
                fields: {
                    title: 'experienceTitle',
                    time: 'experienceTime',
                    location: 'experienceLocation',
                    content: 'experienceContent',
                    images: { el: 'experienceImages', type: 'imagelinks' }
                }
            },
            food: {
                formId: 'foodForm',
                submitBtnText: '添加美食记录',
                editBtnText: '保存修改',
                fields: {
                    title: 'foodTitle',
                    time: 'foodTime',
                    location: 'foodLocation',
                    content: 'foodContent',
                    images: { el: 'foodImages', type: 'imagelinks' }
                }
            },
            suosui: {
                formId: 'suosuiForm',
                submitBtnText: '添加琐碎记录',
                editBtnText: '保存修改',
                fields: {
                    title: 'suosuiTitle',
                    subtitle: 'suosuiSubtitle',
                    date: 'suosuiDate',
                    content: 'suosuiDescription',
                    videoUrl: 'suosuiVideoUrl'
                }
            },
            update: {
                formId: 'updateForm',
                submitBtnText: '添加更新记录',
                editBtnText: '保存修改',
                fields: {
                    title: 'updateTitle',
                    date: 'updateDate',
                    location: 'updateCategory',
                    content: 'updateContent'
                }
            },
            game: {
                formId: 'gameForm',
                submitBtnText: '添加游戏记录',
                editBtnText: '保存修改',
                fields: {
                    title: 'gameTitle',
                    location: 'gameUrl',
                    content: 'gameDescription',
                    images: { el: 'gameIcon', type: 'single' }
                }
            }
        };

        // ========== API 工具函数 ==========

        /**
         * 获取带认证头的 fetch 配置
         */
        function authFetchOptions(method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            if (authToken) {
                options.headers['Authorization'] = 'Bearer ' + authToken;
            }
            if (body) {
                options.body = JSON.stringify(body);
            }
            return options;
        }

        /**
         * 统一的 API 请求函数，自动处理 401 跳转登录
         */
        async function apiRequest(url, method = 'GET', body = null) {
            const options = authFetchOptions(method, body);
            const res = await fetch(apiUrl(url), options);
            if (res.status === 401) {
                // token 失效，跳转登录
                showLoginPanel();
                throw new Error('认证已过期，请重新登录');
            }
            const result = await res.json();
            if (!res.ok) {
                throw new Error(result.error || '请求失败');
            }
            return result;
        }

        // ========== 登录/认证 ==========

        /**
         * 检查登录状态
         */
        async function checkAuth() {
            if (!authToken) {
                showLoginPanel();
                return;
            }
            try {
                const result = await apiRequest('/api/auth/verify');
                if (result.valid) {
                    showAdminPanel(result.user.username);
                    await loadAllData();
                } else {
                    showLoginPanel();
                }
            } catch (error) {
                console.error('验证失败:', error);
                showLoginPanel();
            }
        }

        /**
         * 显示登录页面
         */
        function showLoginPanel() {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
        }

        /**
         * 显示管理面板
         */
        function showAdminPanel(username) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('userDisplay').textContent = '👤 ' + username;
        }

        /**
         * 登录表单提交
         */
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(apiUrl('/api/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();
                if (!res.ok) {
                    showNotification(result.error || '登录失败', 'error');
                    return;
                }
                authToken = result.token;
                localStorage.setItem('authToken', authToken);
                showAdminPanel(result.user.username);
                await loadAllData();
                showNotification('登录成功！', 'success');
            } catch (error) {
                showNotification('登录失败：' + error.message, 'error');
            }
        });

        /**
         * 退出登录
         */
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                authToken = '';
                localStorage.removeItem('authToken');
                showLoginPanel();
                showNotification('已退出登录', 'info');
            }
        }

        // ========== 数据加载/保存（后端 API） ==========

        /**
         * 从后端加载所有内容数据
         */
        async function loadAllData() {
            try {
                const [work, experience, food, suosui, update, blog, game] = await Promise.all([
                    apiRequest('/api/content/work').catch(() => []),
                    apiRequest('/api/content/experience').catch(() => []),
                    apiRequest('/api/content/food').catch(() => []),
                    apiRequest('/api/content/suosui').catch(() => []),
                    apiRequest('/api/content/update').catch(() => []),
                    apiRequest('/api/content/blog').catch(() => []),
                    apiRequest('/api/content/game').catch(() => [])
                ]);
                data = { work, experience, food, suosui, update, blog, game };
                updateStats();
                renderList(currentTab);
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        function formatDate(date) { return new Date(date).toLocaleString('zh-CN'); }

        function getCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }

        function getCurrentDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function setFormDefaults(tabName) {
            const currentTime = getCurrentTime();
            const currentDate = getCurrentDate();
            switch (tabName) {
                case 'work':
                    document.getElementById('workTitle').value = '工作记录-';
                    document.getElementById('workTime').value = currentTime;
                    document.getElementById('workLocation').value = '宁夏-银川';
                    break;
                case 'experience':
                    document.getElementById('experienceTitle').value = '经历记录-';
                    document.getElementById('experienceTime').value = currentTime;
                    document.getElementById('experienceLocation').value = '宁夏-银川';
                    break;
                case 'food':
                    document.getElementById('foodTitle').value = '美食记录-';
                    document.getElementById('foodTime').value = currentTime;
                    document.getElementById('foodLocation').value = '宁夏-银川';
                    break;
                case 'suosui':
                    document.getElementById('suosuiTitle').value = '琐碎记录-';
                    document.getElementById('suosuiDate').value = currentDate;
                    break;
                case 'update':
                    document.getElementById('updateTitle').value = '更新记录-';
                    document.getElementById('updateDate').value = currentTime;
                    break;
                case 'blog':
                    document.getElementById('blogTitle').value = '';
                    document.getElementById('blogDate').value = currentDate;
                    document.getElementById('blogContent').innerHTML = '';
                    break;
                case 'game':
                    document.getElementById('gameTitle').value = '';
                    document.getElementById('gameUrl').value = '';
                    document.getElementById('gameIcon').value = '';
                    document.getElementById('gameDescription').value = '';
                    break;
            }
        }

        function switchTab(tabName) {
            // 切换前取消当前 Tab 的编辑状态
            if (currentTab && currentTab !== tabName && editingIds[currentTab]) {
                cancelEdit(currentTab);
            }
            // 博客模块单独处理
            if (currentTab === 'blog' && currentTab !== tabName && editingBlogId) {
                editingBlogId = null;
                editingIds.blog = null;
                const blogForm = document.getElementById('blogForm');
                const blogCancelBtn = blogForm.querySelector('.cancel-edit-btn');
                if (blogCancelBtn) blogCancelBtn.remove();
                blogForm.querySelector('button[type="submit"]').textContent = '添加博客文章';
            }
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            const targetTab = document.getElementById(tabName + '-tab');
            if (targetTab) targetTab.classList.add('active');
            const buttons = document.querySelectorAll('.tab-button');
            const tabOrder = ['work', 'experience', 'food', 'suosui', 'update', 'blog', 'game'];
            const tabIndex = tabOrder.indexOf(tabName);
            if (tabIndex !== -1 && buttons[tabIndex]) buttons[tabIndex].classList.add('active');
            currentTab = tabName;
            renderList(tabName);
            setFormDefaults(tabName);
        }

        function updateStats() {
            document.getElementById('workCount').textContent = data.work.length;
            document.getElementById('experienceCount').textContent = data.experience.length;
            document.getElementById('foodCount').textContent = data.food.length;
            document.getElementById('suosuiCount').textContent = data.suosui.length;
            document.getElementById('updateCount').textContent = data.update.length;
            document.getElementById('blogCount').textContent = data.blog.length;
            document.getElementById('gameCount').textContent = data.game.length;
        }

        function renderList(type) {
            const container = document.getElementById(type + 'List');
            if (!container) return;
            container.innerHTML = '';
            if (data[type].length === 0) {
                container.innerHTML = '<div class="empty-state">暂无记录，快来添加第一条吧！</div>';
                return;
            }
            data[type].forEach(item => {
                const div = document.createElement('div');
                div.className = 'data-item';
                div.innerHTML = generateItemHTML(type, item);
                container.appendChild(div);
            });
        }

        function generateItemHTML(type, item) {
            // 博客模块已有独立的 editBlog 编辑正文功能，保留原有按钮
            var editBtn = type === 'blog'
                ? '<button class="btn btn-sm blog-item-edit-btn" onclick="editBlog(' + item.id + ')">编辑正文</button>'
                : '<button class="btn btn-sm btn-info" onclick="editItem(\'' + type + '\', ' + item.id + ')">编辑</button>';
            return '<div class="data-item-header"><div class="data-item-title">' + item.title + '</div><div class="data-item-date">' + formatDate(item.createdAt || item.created_at) + '</div></div><div class="data-item-content">' + getItemContent(type, item) + '</div><div class="data-actions">' + editBtn + '<button class="btn btn-sm btn-danger" onclick="deleteItem(\'' + type + '\', ' + item.id + ')">删除</button></div>';
        }

        function getItemContent(type, item) {
            const statusBadge = item.status === 'published'
                ? '<p><strong>状态:</strong> <span style="color: #28a745;">✅ 已发布</span></p>'
                : '<p><strong>状态:</strong> <span style="color: #dc3545;">📝 草稿</span></p>';

            switch (type) {
                case 'work':
                case 'experience':
                case 'food':
                    const imageInfo = item.images && item.images.length > 0
                        ? `<p><strong>图片:</strong> ${item.images.length}张图片</p>`
                        : '<p><strong>图片:</strong> 无</p>';
                    return '<p><strong>时间:</strong> ' + (item.time || '无') + '</p><p><strong>地点:</strong> ' + (item.location || '无') + '</p><p><strong>内容:</strong> ' + (item.content || '无') + '</p>' + imageInfo + statusBadge;
                case 'suosui':
                    return '<p><strong>副标题:</strong> ' + (item.subtitle || '无') + '</p><p><strong>描述:</strong> ' + (item.content || item.description || '无') + '</p><p><strong>日期:</strong> ' + (item.date || '无') + '</p><p><strong>视频:</strong> ' + (item.videoUrl ? '已设置' : '无') + '</p>' + statusBadge;
                case 'update':
                    return '<p><strong>日期:</strong> ' + (item.date || item.time || '无') + '</p><p><strong>分类:</strong> ' + (item.location || '无') + '</p><p><strong>内容:</strong> ' + (item.content || '无') + '</p>' + statusBadge;
                case 'blog':
                    var tags = item.tags && item.tags.length > 0 ? item.tags.join(', ') : '无';
                    var desc = item.location || '无';
                    var hasContent = item.content && item.content.trim().length > 0;
                    return '<p><strong>日期:</strong> ' + (item.date || '无') + '</p><p><strong>摘要:</strong> ' + desc + '</p><p><strong>标签:</strong> ' + tags + '</p><p><strong>正文:</strong> ' + (hasContent ? '已编写 (' + item.content.length + ' 字)' : '无') + '</p>' + statusBadge;
                case 'game':
                    return '<p><strong>游戏名称:</strong> ' + (item.title || '无') + '</p><p><strong>描述:</strong> ' + (item.content || '无') + '</p><p><strong>游戏链接:</strong> <a href="' + (item.location || '#') + '" target="_blank" style="color:#e1652f;">点击打开</a></p><p><strong>图标:</strong> ' + (item.images && item.images[0] ? '<img src="' + item.images[0] + '" style="width:40px;height:40px;border-radius:6px;vertical-align:middle;" onerror="this.style.display=\'none\'">' : '无') + '</p>' + statusBadge;
                default: return '<p>未知内容</p>';
            }
        }

        /**
         * 编辑记录 —— 将数据填充到表单，切换为编辑模式
         */
        function editItem(type, id) {
            const item = data[type].find(it => it.id === id);
            if (!item) return;
            editingIds[type] = id;
            const config = formFieldConfig[type];
            if (!config) return;

            // 遍历字段配置，将数据填充到对应表单元素
            Object.keys(config.fields).forEach(key => {
                const fieldDef = config.fields[key];
                if (typeof fieldDef === 'string') {
                    // 简单字段：fieldDef 就是元素 id
                    const el = document.getElementById(fieldDef);
                    if (el) el.value = item[key] || '';
                } else if (typeof fieldDef === 'object') {
                    // 复合字段：{ el: '元素id', type: 'imagelinks' | 'single' }
                    const el = document.getElementById(fieldDef.el);
                    if (!el) return;
                    if (fieldDef.type === 'imagelinks') {
                        // 图片链接数组 → 每行一个
                        el.value = (item.images || []).join('\n');
                    } else if (fieldDef.type === 'single') {
                        // 单个图片链接
                        el.value = (item.images && item.images[0]) || '';
                    }
                }
            });

            // 修改提交按钮文案
            const form = document.getElementById(config.formId);
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) submitBtn.textContent = config.editBtnText;

            // 添加取消编辑按钮（如果还没有）
            let cancelBtn = form.querySelector('.cancel-edit-btn');
            if (!cancelBtn) {
                cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'btn btn-danger cancel-edit-btn';
                cancelBtn.textContent = '取消编辑';
                cancelBtn.onclick = function() { cancelEdit(type); };
                form.querySelector('.btn-group').appendChild(cancelBtn);
            }

            // 滚动到表单
            form.scrollIntoView({ behavior: 'smooth' });
            showNotification('已加载记录内容，修改后点击「保存修改」', 'info');
        }

        /**

            try {
                await apiRequest('/api/content/' + type + '/' + id, 'DELETE');
                data[type] = data[type].filter(item => item.id !== id);
                renderList(type);
                updateStats();
                showNotification('记录删除成功！', 'success');

        /**
         * 清空数据 —— 逐条删除所有记录
         */
        async function clearData(type) {
            const typeNames = { 'work': '工作', 'experience': '经历', 'food': '美食', 'suosui': '琐碎', 'update': '更新', 'blog': '博客', 'game': '游戏' };
            if (!confirm('确定要清空所有' + typeNames[type] + '数据吗？此操作不可恢复！')) return;
            try {
                const promises = data[type].map(item =>
                    apiRequest('/api/content/' + type + '/' + item.id, 'DELETE')
                );
                await Promise.all(promises);
                data[type] = [];
                renderList(type);
                updateStats();
                showNotification(typeNames[type] + '数据已全部清空！', 'success');
            } catch (error) {
                showNotification('清空失败：' + error.message, 'error');
                await loadAllData();
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 3000;
                padding: 14px 22px; border-radius: 8px; color: white;
                font-size: 14px; font-weight: 500;
                background: ${type === 'success' ? '#4caf50' : type === 'error' ? '#f44336' : '#e1652f'};
                box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.style.transform = 'translateX(0)', 100);
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        // ========== 生成代码功能（保留原功能） ==========

        function generateCode(type) {
            if (data[type].length === 0) {
                showNotification('没有数据可以生成代码！', 'error');
                return;
            }
            const processedData = data[type].map(item => {
                const numberMatch = item.title.match(/(\d+)/);
                const id = numberMatch ? parseInt(numberMatch[1]) : Math.floor(Math.random() * 1000) + 1;
                if (type === 'suosui') {
                    return {
                        id: id,
                        title: item.title,
                        subtitle: item.subtitle || "程宝vlog",
                        description: item.content || item.description || "程宝vlog.part2",
                        videoUrl: item.videoUrl || "//player.bilibili.com/player.html?isOutside=true&aid=336426195&bvid=BV1SR4y1j7i2&cid=218963994&page=1",
                        tags: generateRandomTags(),
                        date: item.date
                    };
                } else if (type === 'update') {
                    return {
                        id: id,
                        title: item.title,
                        date: item.date || item.time || "",
                        category: item.location || "",
                        content: item.content || ""
                    };
                } else if (type === 'blog') {
                    return {
                        id: id,
                        title: item.title,
                        date: item.date || "",
                        location: item.location || "",
                        description: (item.images && item.images[0]) || "",
                        tags: item.tags || [],
                        content: item.content || ""
                    };
                } else if (type === 'game') {
                    return {
                        id: id,
                        title: item.title,
                        url: item.location || "",
                        icon: (item.images && item.images[0]) || "",
                        description: item.content || ""
                    };
                } else {
                    return {
                        id: id,
                        title: item.title,
                        time: item.time,
                        location: item.location || item.content || "记录简历照片，随取随用",
                        images: item.images || [],
                        content: item.content || item.location || "记录简历照片，随取随用"
                    };
                }
            });
            const jsonCode = formatJsonCustom(processedData, type);
            document.getElementById('generatedCode').textContent = jsonCode;
            document.getElementById('codeModal').style.display = 'block';
            showNotification(`已生成${data[type].length}条${getTypeName(type)}记录的JSON代码！`, 'success');
        }

        function formatJsonCustom(data, type) {
            let result = '';
            data.forEach((item, index) => {
                result += '{\n';
                result += `    id: ${item.id},\n`;
                result += `    title: "${item.title}",\n`;
                if (type === 'suosui') {
                    result += `    subtitle: "${item.subtitle}",\n`;
                    result += `    description: "${item.description}",\n`;
                    result += `    videoUrl: "${item.videoUrl}",\n`;
                    if (item.tags && item.tags.length > 0) {
                        result += '    tags: [';
                        item.tags.forEach((tag, tagIndex) => {
                            const comma = tagIndex < item.tags.length - 1 ? ', ' : '';
                            result += `"${tag}"${comma}`;
                        });
                        result += '],\n';
                    } else {
                        const randomTags = generateRandomTags();
                        result += `    tags: ["${randomTags.join('", "')}"],\n`;
                    }
                    result += `    date: "${item.date}"\n`;
                } else if (type === 'update') {
                    result += `    date: "${item.date}",\n`;
                    result += `    category: "${item.category}",\n`;
                    result += `    content: "${item.content}"\n`;
                } else if (type === 'blog') {
                    result += `    date: "${item.date}",\n`;
                    result += `    location: "${item.location}",\n`;
                    result += `    description: "${item.description}",\n`;
                    result += '    tags: [';
                    if (item.tags && item.tags.length > 0) {
                        item.tags.forEach((tag, tagIndex) => {
                            const comma = tagIndex < item.tags.length - 1 ? ', ' : '';
                            result += `"${tag}"${comma}`;
                        });
                    }
                    result += '],\n';
                    result += `    content: "${item.content}"\n`;
                } else if (type === 'game') {
                    result += `    url: "${item.url}",\n`;
                    result += `    icon: "${item.icon}",\n`;
                    result += `    description: "${item.description}"\n`;
                } else {
                    result += `    time: "${item.time}",\n`;
                    result += `    location: "${item.location}",\n`;
                    if (item.images && item.images.length > 0) {
                        result += '    images: [\n';
                        item.images.forEach((img, imgIndex) => {
                            const comma = imgIndex < item.images.length - 1 ? ',' : '';
                            result += `        "${img}"${comma}\n`;
                        });
                        result += '    ],\n';
                    } else {
                        result += '    images: [],\n';
                    }
                    result += `    content: "${item.content}"\n`;
                }
                result += '},\n';
                if (index < data.length - 1) {
                    result += '\n';
                }
            });
            return result;
        }

        function generateRandomTags() {
            const allTags = [
                "回忆", "美好", "生活", "感悟",
                "时光", "温暖", "快乐", "成长",
                "梦想", "希望", "友情", "爱情",
                "家庭", "旅行", "美食", "音乐",
                "电影", "读书", "运动", "学习",
                "工作", "思考", "感恩", "珍惜",
                "青春", "回味", "岁月", "故事",
                "心情", "日常", "记录", "分享"
            ];
            const shuffled = [...allTags].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 2);
        }

        function getTypeName(type) {
            const typeNames = { 'work': '工作', 'experience': '经历', 'food': '美食', 'suosui': '琐碎', 'update': '更新', 'blog': '博客', 'game': '游戏' };
            return typeNames[type] || type;
        }

        function copyCode() {
            const codeElement = document.getElementById('generatedCode');
            const text = codeElement.textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('代码已复制到剪贴板！', 'success');
                }).catch(() => {
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showNotification('代码已复制到剪贴板！', 'success');
            } catch (err) {
                showNotification('复制失败，请手动复制代码！', 'error');
            }
            document.body.removeChild(textArea);
        }

        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('codeModal');
            if (event.target === modal) {
                closeCodeModal();
            }
        }
