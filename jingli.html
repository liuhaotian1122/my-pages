        /* ========== 访问足迹 ========== */
        .visit-footprint {
            max-width: 1000px;
            margin: 50px auto 30px;
            padding: 0 15px;
        }

        .visit-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .visit-head h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .visit-head h2 i {
            color: #e1652f;
            margin-right: 8px;
        }

        .visit-stats {
            display: flex;
            gap: 18px;
            font-size: 13px;
            color: #888;
        }

        .visit-stats b {
            color: #e1652f;
            font-size: 18px;
            margin-left: 4px;
        }

        .visit-map {
            height: 360px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #1a2029;
            z-index: 0;
        }

        .visit-city-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .visit-city {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            background: rgba(225, 101, 47, 0.08);
            color: #555;
            transition: all 0.3s ease;
        }

        .visit-city:hover {
            transform: translateY(-2px);
            background: rgba(225, 101, 47, 0.15);
        }

        .visit-city .cnt {
            color: #e1652f;
            font-weight: 700;
        }

        .visit-note {
            margin-top: 14px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }

        html[data-theme="dark"] .visit-head h2 {
            color: var(--dm-text);
        }

        html[data-theme="dark"] .visit-stats {
            color: var(--dm-sub);
        }

        html[data-theme="dark"] .visit-city {
            color: var(--dm-sub);
        }

    <script>
        // ==================== 访问足迹 ====================
        (function () {
            var API = 'https://api.liuhaotian.cc.cd'; // 与 js/api-config.js 保持一致
            var mapEl = document.getElementById('visitMap');

            // 国家代码 → 旗帜 emoji
            function flagOf(cc) {
                if (!cc || !/^[A-Za-z]{2}$/.test(cc)) return '🌍';
                return String.fromCodePoint.apply(null,
                    cc.toUpperCase().split('').map(function (c) { return 0x1F1E6 + c.charCodeAt(0) - 65; }));
            }

            function render(stats) {
                document.getElementById('visitPv').textContent = stats.pv;
                document.getElementById('visitUv').textContent = stats.uv;
                var cities = (stats.cities || []).filter(function (c) { return c.city && c.city !== '未知'; });
                document.getElementById('visitCityCount').textContent = cities.length;

                // 城市徽章（最多 12 个）
                document.getElementById('visitCityList').innerHTML = cities.slice(0, 12).map(function (c) {
                    return '<span class="visit-city" title="' + (c.region || c.city) + '">'
                        + flagOf(c.country) + ' ' + c.city
                        + ' <span class="cnt">' + c.count + '</span></span>';
                }).join('');

                var pts = cities.filter(function (c) { return c.lat != null && c.lon != null; });
                if (!pts.length) return;
                // 地图滚入视口后再加载 Leaflet（首屏不加载 100KB+ 的地图库）
                if ('IntersectionObserver' in window) {
                    var io = new IntersectionObserver(function (entries) {
                        if (entries[0].isIntersecting) {
                            io.disconnect();
                            loadLeaflet(function () { drawMap(pts); });
                        }
                    }, { rootMargin: '200px' });
                    io.observe(mapEl);
                } else {
                    loadLeaflet(function () { drawMap(pts); });
                }
            }

            function loadLeaflet(cb) {
                if (window.L) return cb();
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css';
                document.head.appendChild(link);
                var s = document.createElement('script');
                s.src = 'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js';
                s.onload = cb;
                // bootcdn 失败时回退 unpkg；再失败则只显示城市榜，不影响页面
                s.onerror = function () {
                    var s2 = document.createElement('script');
                    s2.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.min.js';
                    s2.onload = cb;
                    document.head.appendChild(s2);
                };
                document.head.appendChild(s);
            }

            function drawMap(pts) {
                if (!window.L || !mapEl) return;
                mapEl.style.display = 'block';
                var map = L.map('visitMap', { scrollWheelZoom: false });
                // 深色底图与站点深色模式气质一致，浅色模式下也协调
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    subdomains: 'abcd',
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap &copy; CARTO'
                }).addTo(map);

                var max = Math.max.apply(null, pts.map(function (p) { return p.count; }));
                var bounds = [];
                pts.forEach(function (p) {
                    var r = 6 + 14 * Math.sqrt(p.count / max);
                    L.circleMarker([p.lat, p.lon], {
                        radius: r, color: '#fff', weight: 1,
                        fillColor: '#e1652f', fillOpacity: 0.9
                    }).addTo(map)
                      .bindPopup(flagOf(p.country) + ' ' + p.city + ' · ' + p.count + ' 次访问');
                    bounds.push([p.lat, p.lon]);
                });
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 8 });
            }

            fetch(API + '/api/public/visits/summary')
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (stats) { if (stats) render(stats); })
                .catch(function () { /* 统计不可用时静默 */ });
        })();
    </script>

    <script>
        // 延迟加载JavaScript
        const loadScript = (src, callback) => {
            const script = document.createElement('script');
            script.src = src;
            script.async = true;
            if (callback) script.onload = callback;
            document.head.appendChild(script);
        };

        // 立即加载jQuery
        loadScript('assets/js/jquery.min.js', () => {
            loadScript('assets/js/amazeui.min.js');
            loadScript('js/public.js');
        });




        // 解析 "2025.09.29" / "2021.10.4" 等时间为时间戳（无法解析返回 0）
        function parseExpTime(t) {
            if (!t) return 0;
            const p = String(t).split(/[^\d]+/).filter(Boolean).map(Number);
            if (p.length >= 3) return new Date(p[0], p[1] - 1, p[2]).getTime();
            if (p.length === 2) return new Date(p[0], p[1] - 1).getTime();
            if (p.length === 1) return new Date(p[0], 0).getTime();
            return 0;
        }

        

        // 经历数据（后端实时加载，DOMContentLoaded 后异步填充）
        let experienceData = [];



        // 分页管理类
        class ExperiencePagination {
            constructor() {
                this.currentPage = 1;
                this.pageSize = 5;
                this.totalItems = 0;
                this.filteredData = [...experienceData];
                this.searchTerm = '';
                this.sortOrder = 'latest'; // 'default' 或 'latest' - 默认显示最新

                this.experienceContainer = document.getElementById('experienceContainer');
                this.pagination = document.getElementById('pagination');
                this.pageInfo = document.getElementById('pageInfo');
                this.searchInput = document.getElementById('searchInput');
                this.searchBtn = document.getElementById('searchBtn');
                this.pageSizeSelect = document.getElementById('pageSizeSelect');
                this.loadingSpinner = document.getElementById('loadingSpinner');
                this.noResults = document.getElementById('noResults');
                this.sortLatestBtn = document.getElementById('sortLatestBtn');
                this.sortDefaultBtn = document.getElementById('sortDefaultBtn');

                this.init();
            }

            init() {
                this.bindEvents();
                this.updateData();
                this.render();
                this.updateSortButtons();
            }

            bindEvents() {
                // 搜索事件
                this.searchBtn.addEventListener('click', () => this.handleSearch());
                this.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.handleSearch();
                    }
                });

                // 每页显示数量变化
                this.pageSizeSelect.addEventListener('change', (e) => {
                    this.pageSize = parseInt(e.target.value);
                    this.currentPage = 1;
                    this.updateData();
                    this.render();
                });

                // 排序按钮事件
                this.sortLatestBtn.addEventListener('click', () => {
                    this.sortOrder = 'latest';
                    this.currentPage = 1;
                    this.updateData();
                    this.render();
                    this.updateSortButtons();
                });

                this.sortDefaultBtn.addEventListener('click', () => {
                    this.sortOrder = 'default';
                    this.currentPage = 1;
                    this.updateData();
                    this.render();
                    this.updateSortButtons();
                });

                // 实时搜索（可选）
                this.searchInput.addEventListener('input', (e) => {
                    clearTimeout(this.searchTimeout);
                    this.searchTimeout = setTimeout(() => {
                        this.handleSearch();
                    }, 500);
                });
            }

            handleSearch() {
                this.searchTerm = this.searchInput.value.trim().toLowerCase();
                this.currentPage = 1;
                this.updateData();
                this.render();
            }

            updateData() {
                // 过滤数据
                if (this.searchTerm) {
                    this.filteredData = experienceData.filter(exp =>
                        exp.title.toLowerCase().includes(this.searchTerm) ||
                        exp.location.toLowerCase().includes(this.searchTerm) ||
                        exp.content.toLowerCase().includes(this.searchTerm) ||
                        exp.time.includes(this.searchTerm)
                    );
                } else {
                    this.filteredData = [...experienceData];
                }

                // 应用排序
                if (this.sortOrder === 'latest') {
                    // 按时间降序展示最新内容；同时间保持原顺序（后端数据在前即更新的在前）
                    this.filteredData.sort((a, b) => parseExpTime(b.time) - parseExpTime(a.time));
                } else {
                    this.filteredData.sort((a, b) => a.id - b.id); // ID升序排列，默认顺序
                }

                this.totalItems = this.filteredData.length;
            }

            updateSortButtons() {
                if (this.sortOrder === 'latest') {
                    this.sortLatestBtn.style.display = 'none';
                    this.sortLatestBtn.classList.remove('active');
                    this.sortDefaultBtn.style.display = 'inline-block';
                    this.sortDefaultBtn.classList.add('active');
                } else {
                    this.sortLatestBtn.style.display = 'inline-block';
                    this.sortLatestBtn.classList.remove('active');
                    this.sortDefaultBtn.style.display = 'none';
                    this.sortDefaultBtn.classList.remove('active');
                }
            }

            render() {
                this.showLoading();

                // 立即渲染（下一帧执行，无人工延迟）
                requestAnimationFrame(() => {
                    this.renderExperienceList();
                    this.renderPagination();
                    this.renderPageInfo();
                    // 数据未就绪时保持加载动画（hideLoading 由数据就绪后的渲染触发）
                    if (dataReady || this.filteredData.length > 0) this.hideLoading();
                    this.reinitImageViewer();
                });
            }

            showLoading() {
                this.loadingSpinner.style.display = 'block';
                this.experienceContainer.style.opacity = '0.5';
                this.noResults.style.display = 'none';
            }

            hideLoading() {
                this.loadingSpinner.style.display = 'none';
                this.experienceContainer.style.opacity = '1';
            }

            renderExperienceList() {
                const startIndex = (this.currentPage - 1) * this.pageSize;
                const endIndex = startIndex + this.pageSize;
                const currentPageData = this.filteredData.slice(startIndex, endIndex);

                if (currentPageData.length === 0) {
                    if (!dataReady) {
                        // 后端数据尚未就绪：保持加载动画，不误显示"无结果"；
                        // 若阶段1已渲染出最新记录，则原样保留不强清
                        if (!this.experienceContainer.children.length) this.showLoading();
                        return;
                    }
                    this.experienceContainer.innerHTML = '';
                    this.noResults.style.display = 'block';
                    return;
                }

                this.noResults.style.display = 'none';

                const experienceHTML = currentPageData.map(exp => `
                    <div class="work-section">
                        <div class="work-title">
                            <h2>${exp.title}</h2>
                        </div>
                        <div class="work-info">
                            <h2>时间：${exp.time}</h2>
                            <h2>地点：${exp.location}</h2>
                    ${exp.content ? `<h2>内容：${exp.content}</h2>` : ''}
                        </div>
                        <div class="image-gallery" data-gallery="work${exp.id}">
                            ${exp.images.map((img, index) => `
                                <div class="gallery-img-container loading" data-index="${index + 1}">
                                    <img src="${img}" class="gallery-img" alt="照片${index + 1}" loading="lazy" decoding="async"
                                         data-title="${exp.title} - 照片${index + 1}" data-date="${exp.time}"
                                         onload="handleImageLoad(this)" onerror="handleImageError(this)">
                                    <div class="image-index">${index + 1}</div>
                                    <div class="zoom-icon">🔍</div>
                                    <div class="image-tooltip">${exp.title} - 照片${index + 1}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');

                this.experienceContainer.innerHTML = experienceHTML;

                // 添加动画效果
                setTimeout(() => {
                    const workSections = this.experienceContainer.querySelectorAll('.work-section');
                    workSections.forEach((section, index) => {
                        setTimeout(() => {
                            section.classList.add('show');
                        }, index * 100);
                    });
                }, 50);
                
                // 强制触发图片加载检查
                this.checkImageLoading();
                
                // 确保所有新生成的图片都有正确的加载状态
                this.initializeImageLoading();
            }

            renderPagination() {
                const totalPages = Math.ceil(this.totalItems / this.pageSize);

                if (totalPages <= 1) {
                    this.pagination.innerHTML = '';
                    return;
                }

                let paginationHTML = '';

                // 上一页按钮
                if (this.currentPage > 1) {
                    paginationHTML += `<li><a href="#" data-page="${this.currentPage - 1}">‹ 上一页</a></li>`;
                } else {
                    paginationHTML += `<li><span class="disabled">‹ 上一页</span></li>`;
                }

                // 页码按钮
                const startPage = Math.max(1, this.currentPage - 2);
                const endPage = Math.min(totalPages, this.currentPage + 2);

                if (startPage > 1) {
                    paginationHTML += `<li><a href="#" data-page="1">1</a></li>`;
                    if (startPage > 2) {
                        paginationHTML += `<li><span class="disabled">...</span></li>`;
                    }
                }

                for (let i = startPage; i <= endPage; i++) {
                    if (i === this.currentPage) {
                        paginationHTML += `<li><span class="current">${i}</span></li>`;
                    } else {
                        paginationHTML += `<li><a href="#" data-page="${i}">${i}</a></li>`;
                    }
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        paginationHTML += `<li><span class="disabled">...</span></li>`;
                    }
                    paginationHTML += `<li><a href="#" data-page="${totalPages}">${totalPages}</a></li>`;
                }

                // 下一页按钮
                if (this.currentPage < totalPages) {
                    paginationHTML += `<li><a href="#" data-page="${this.currentPage + 1}">下一页 ›</a></li>`;
                } else {
                    paginationHTML += `<li><span class="disabled">下一页 ›</span></li>`;
                }

                this.pagination.innerHTML = paginationHTML;

                // 使用事件委托绑定分页点击事件（只绑定一次）
                if (!this._paginationBound) {
                    this.pagination.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (e.target.tagName === 'A' && e.target.dataset.page) {
                            this.currentPage = parseInt(e.target.dataset.page);
                            this.render();

                            // 滚动到顶部
                            const header = document.querySelector('header');
                            if (header) {
                                header.scrollIntoView({ behavior: 'smooth' });
                            } else {
                                window.scrollTo({ top: 0, behavior: 'smooth' });
                            }
                        }
                    });
                    this._paginationBound = true;
                }
            }

            renderPageInfo() {
                const startItem = (this.currentPage - 1) * this.pageSize + 1;
                const endItem = Math.min(this.currentPage * this.pageSize, this.totalItems);
                const totalPages = Math.ceil(this.totalItems / this.pageSize);

                if (this.totalItems === 0) {
                    this.pageInfo.textContent = '';
                    return;
                }

                this.pageInfo.textContent = `显示 ${startItem}-${endItem} 条，共 ${this.totalItems} 条 (第 ${this.currentPage}/${totalPages} 页)`;
            }

            reinitImageViewer() {
                // 图片点击事件已通过事件委托在 document 上绑定，无需重复绑定
                // 此方法保留用于将来扩展（如需在渲染后做额外处理）
                if (window.imageViewer) {
                    window.imageViewer.bindImageEvents();
                }
            }

            checkImageLoading() {
                // 延迟检查图片加载状态，确保图片正确显示
                setTimeout(() => {
                    const containers = document.querySelectorAll('.gallery-img-container.loading');
                    containers.forEach(container => {
                        const img = container.querySelector('.gallery-img');
                        if (img && img.complete) {
                            handleImageLoad(img);
                        }
                    });
                }, 100);
            }

            initializeImageLoading() {
                // 为所有新生成的图片设置加载事件监听器
                const images = this.experienceContainer.querySelectorAll('.gallery-img');
                images.forEach(img => {
                    // 确保容器处于loading状态
                    const container = img.closest('.gallery-img-container');
                    if (container) {
                        container.classList.add('loading');
                        container.classList.remove('loaded', 'error');
                    }
                    
                    // 如果图片已经加载完成，立即触发处理
                    if (img.complete && img.naturalWidth > 0) {
                        setTimeout(() => handleImageLoad(img), 100);
                    }
                });
            }
        }

        // 图片查看器功能
        class ImageViewer {
            constructor() {
                this.currentImages = [];
                this.currentIndex = 0;
                this.isOpen = false;
                this.initialized = false;
                this.imageClickHandler = null;
                this.paginationClickHandler = null;

                this.viewer = document.getElementById('imageViewer');
                this.viewerImage = document.getElementById('viewerImage');
                this.imageInfo = document.getElementById('imageInfo');
                this.imageTitle = document.getElementById('imageTitle');
                this.imageCounter = document.getElementById('imageCounter');
                this.thumbnailNav = document.getElementById('thumbnailNav');
                this.loading = document.getElementById('imageLoading');

                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.closeBtn = document.getElementById('closeBtn');

                this.init();
            }

            init() {
                // 只初始化一次的事件监听器
                if (!this.initialized) {
                    // 导航按钮事件
                    this.prevBtn.addEventListener('click', (e) => { e.stopPropagation(); this.showPrevious(); });
                    this.nextBtn.addEventListener('click', (e) => { e.stopPropagation(); this.showNext(); });
                    this.closeBtn.addEventListener('click', (e) => { e.stopPropagation(); this.closeViewer(); });

                    // 键盘事件
                    document.addEventListener('keydown', (e) => {
                        if (!this.isOpen) return;

                        switch (e.key) {
                            case 'ArrowLeft':
                                this.showPrevious();
                                break;
                            case 'ArrowRight':
                                this.showNext();
                                break;
                            case 'Escape':
                                this.closeViewer();
                                break;
                        }
                    });

                    // 点击背景或图片本身关闭灯箱
                    this.viewer.addEventListener('click', (e) => {
                        if (e.target === this.viewer ||
                            e.target === this.viewer.querySelector('.viewer-container') ||
                            e.target === this.viewerImage) {
                            this.closeViewer();
                        }
                    });

                    // 触摸滑动支持——绑定在 viewer 容器上，而非 viewerImage
                    // 因为 showImage 加载期间 viewerImage 会被隐藏，导致 touch 事件丢失
                    this.addTouchSupport();

                    this.initialized = true;
                }

                // 使用事件委托绑定图片点击事件（只需绑定一次）
                this.bindImageEvents();
            }

            bindImageEvents() {
                // 如果已经绑定过，不再重复绑定
                if (this.imageClickHandler) return;

                this.imageClickHandler = (e) => {
                    // 从点击目标向上查找画廊图片容器
                    const container = e.target.closest('.gallery-img-container');
                    if (!container) return;

                    // 错误状态的图片不打开灯箱
                    if (container.classList.contains('error')) return;

                    const imgElement = container.querySelector('.gallery-img');
                    if (!imgElement) return;

                    const gallery = imgElement.closest('[data-gallery]');
                    if (!gallery) return;

                    const galleryImages = gallery.querySelectorAll('.gallery-img');
                    const imageIndex = Array.from(galleryImages).indexOf(imgElement);
                    if (imageIndex >= 0) {
                        this.openViewer(galleryImages, imageIndex);
                    }
                };
                document.addEventListener('click', this.imageClickHandler);
            }

            openViewer(images, startIndex = 0) {
                this.currentImages = Array.from(images);
                this.currentIndex = startIndex;
                this.isOpen = true;

                this.viewer.classList.add('active');
                document.body.style.overflow = 'hidden';

                this.showImage(this.currentIndex);
                this.createThumbnails();
            }

            showImage(index) {
                if (index < 0 || index >= this.currentImages.length) return;

                this.currentIndex = index;
                const img = this.currentImages[index];

                // 显示加载动画，用 opacity 隐藏旧图片而不使用 display:none
                // 这样 viewerImage 仍可接收触摸事件
                this.loading.style.display = 'block';
                this.viewerImage.style.opacity = '0';

                // 加载图片
                const newImg = new Image();
                newImg.onload = () => {
                    this.viewerImage.src = newImg.src;
                    this.viewerImage.alt = img.alt;

                    // 更新信息
                    this.imageTitle.textContent = img.dataset.title || img.alt || '图片';
                    this.imageCounter.textContent = ` (${index + 1}/${this.currentImages.length})`;

                    // 隐藏加载动画，显示图片
                    this.loading.style.display = 'none';
                    this.viewerImage.style.opacity = '1';

                    // 更新缩略图状态
                    this.updateThumbnails();
                };

                newImg.onerror = () => {
                    this.loading.style.display = 'none';
                    this.viewerImage.style.opacity = '0';
                    this.imageTitle.textContent = '图片加载失败';
                    this.imageCounter.textContent = ` (${index + 1}/${this.currentImages.length})`;
                };

                newImg.src = img.src;

                // 更新导航按钮状态
                this.prevBtn.style.display = this.currentImages.length > 1 ? 'block' : 'none';
                this.nextBtn.style.display = this.currentImages.length > 1 ? 'block' : 'none';
            }

            showPrevious() {
                const newIndex = this.currentIndex > 0 ? this.currentIndex - 1 : this.currentImages.length - 1;
                this.showImage(newIndex);
            }

            showNext() {
                const newIndex = this.currentIndex < this.currentImages.length - 1 ? this.currentIndex + 1 : 0;
                this.showImage(newIndex);
            }

            closeViewer() {
                this.isOpen = false;
                this.viewer.classList.remove('active');
                document.body.style.overflow = '';
                // 清空图片 src，避免下次打开时闪现旧图
                this.viewerImage.src = '';
                this.viewerImage.style.opacity = '0';
                this.loading.style.display = 'none';
                this.thumbnailNav.style.display = 'none';
            }

            createThumbnails() {
                if (this.currentImages.length <= 1) {
                    this.thumbnailNav.style.display = 'none';
                    return;
                }

                this.thumbnailNav.style.display = 'flex';
                this.thumbnailNav.innerHTML = '';

                this.currentImages.forEach((img, index) => {
                    const thumbnail = document.createElement('img');
                    // 使用 loading="lazy" 延迟加载缩略图，避免一次性请求所有大图
                    thumbnail.loading = 'lazy';
                    thumbnail.src = img.src;
                    thumbnail.className = 'thumbnail';
                    thumbnail.alt = `缩略图 ${index + 1}`;
                    thumbnail.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.showImage(index);
                    });
                    this.thumbnailNav.appendChild(thumbnail);
                });
            }

            updateThumbnails() {
                const thumbnails = this.thumbnailNav.querySelectorAll('.thumbnail');
                thumbnails.forEach((thumb, index) => {
                    thumb.classList.toggle('active', index === this.currentIndex);
                });
            }

            addTouchSupport() {
                let startX = 0;
                let startY = 0;
                let isTracking = false;

                // 绑定在 viewer 容器上（而非 viewerImage），
                // 因为 showImage 加载期间 viewerImage 可能被隐藏
                this.viewer.addEventListener('touchstart', (e) => {
                    if (!this.isOpen) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isTracking = true;
                }, { passive: true });

                this.viewer.addEventListener('touchend', (e) => {
                    if (!this.isOpen || !isTracking) return;
                    isTracking = false;

                    if (!startX || !startY) return;

                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;

                    const diffX = startX - endX;
                    const diffY = startY - endY;

                    // 水平滑动距离大于垂直滑动距离，且滑动距离足够
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                        if (diffX > 0) {
                            // 向左滑动，显示下一张
                            this.showNext();
                        } else {
                            // 向右滑动，显示上一张
                            this.showPrevious();
                        }
                    }

                    startX = 0;
                    startY = 0;
                }, { passive: true });
            }
        }

        // 图片加载处理函数
        function handleImageLoad(img) {
            const container = img.closest('.gallery-img-container');
            if (container) {
                // 添加一个小延迟确保骨架屏效果被看到
                setTimeout(() => {
                    container.classList.remove('loading');
                    container.classList.add('loaded');
                    
                    // 图片淡入效果已经在CSS中定义了，这里不需要额外处理
                    // CSS中的 .gallery-img-container.loaded .gallery-img 已经处理了过渡效果
                }, 150);
            }
        }

        // 图片错误处理函数
        function handleImageError(img) {
            const container = img.closest('.gallery-img-container');
            if (container) {
                setTimeout(() => {
                    container.classList.remove('loading');
                    container.classList.add('error');
                    // 保留原有的图片元素，只是隐藏它
                    if (img) {
                        img.style.display = 'none';
                    }
                }, 150);
            }
        }

        // 预加载图片的函数
        function preloadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

// ========== 快速加载策略：三阶段渐进式加载 ==========
// 阶段1：立即显示最新一条经历记录
// 阶段2：后台加载完整数据并更新列表

let dataReady = false; // 后端数据是否就绪（就绪前空列表保持加载动画，不误显示"无结果"）

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', () => {
        // 初始化图片查看器
    window.imageViewer = new ImageViewer();

    // 使用静态数据初始化分页（后台准备）
    window.experiencePagination = new ExperiencePagination();

    // 🔄 阶段2：异步从后端加载数据并渲染完整列表（不阻塞页面渲染）
    loadDynamicData(window.experiencePagination);

    // 检测是否为移动设备
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // 添加图片懒加载观察器（仅在非移动设备上使用）
    if (!isMobile && 'IntersectionObserver' in window) {
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    if (img.dataset.src) {
                        img.src = img.dataset.src;
                        img.removeAttribute('data-src');
                        observer.unobserve(img);
                    } else if (img.src) {
                        // 图片已设置 src，检查是否已加载完成
                        // 注意：HTML 中已有 onload="handleImageLoad(this)" onerror="handleImageError(this)"
                        // 此处仅补查已 complete 但未触发 onload 的情况
                        if (img.complete && img.naturalWidth > 0) {
                            handleImageLoad(img);
                        }
                    }
                }
            });
        });

        // 观察所有图片容器
        document.querySelectorAll('.gallery-img').forEach(img => {
            imageObserver.observe(img);
        });
    } else {
        // 移动端或不支持 IntersectionObserver 的浏览器，补查已加载完成的图片
        // 注意：HTML 中已有 onload/onerror 内联事件，此处仅补查 complete 状态
        const images = document.querySelectorAll('.gallery-img');
        images.forEach(img => {
            if (img.src && img.complete && img.naturalWidth > 0) {
                handleImageLoad(img);
            }
        });
    }
});

/**
 * 异步加载动态数据并更新列表（阶段2：完整加载）
 * @param {ExperiencePagination} pagination - 分页实例
 */
        function fetchExperienceData(limit) {
            const url = apiUrl('/api/public/experience') + (limit ? '?limit=' + limit : '');
            return fetch(url)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);
        }

/**
 * 🔄 两阶段加载：先拉最新一页快速展示首屏，后台静默补全剩余数据
 * @param {ExperiencePagination} pagination - 分页实例
 */
        async function loadDynamicData(pagination) {
            // 阶段1：只拉最新一页（前 N 条），最快让用户看到内容
            const firstPage = await fetchExperienceData(pagination.pageSize);
            experienceData = firstPage || [];
            dataReady = true; // 数据就绪（无论是否有记录），此后空列表才显示"无结果"

            pagination.currentPage = 1;
            pagination.updateData();
            pagination.render();
            pagination.reinitImageViewer();

            const paginationContainer = document.getElementById('paginationContainer');
            if (paginationContainer) paginationContainer.style.display = experienceData.length > 0 ? 'flex' : 'none';
            console.log('⚡ 快速加载：最新 ' + experienceData.length + ' 条经历记录已显示');

            // 阶段2：后台静默加载全部，条数有变化时才更新界面（不打断用户浏览）
            const all = await fetchExperienceData();
            if (all && all.length > experienceData.length) {
                experienceData = all;
                pagination.updateData();
                pagination.render();
                pagination.reinitImageViewer();
                console.log('✅ 全部加载完成：共 ' + experienceData.length + ' 条经历记录');
            }
        }
        
        // 页面完全加载后再次检查图片加载状态
        window.addEventListener('load', () => {
            // 延迟执行以确保所有资源加载完成
            setTimeout(() => {
                const images = document.querySelectorAll('.gallery-img');
                images.forEach(img => {
                    if (img.complete && img.naturalWidth > 0 && img.closest('.gallery-img-container')?.classList.contains('loading')) {
                        handleImageLoad(img);
                    }
                });
            }, 500);
        });

    </script>
