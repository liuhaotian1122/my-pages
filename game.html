<script>
    // 默认静态游戏数据
    var staticGames = [
        { title: '超级玛丽', url: 'https://www.yikm.net/play?id=3501&n=L2Zjcm9tL2R6bXgvU3VwZXIgTWFyaW8gQnJvcy4gKFcpIFshXS5uZXM=&t=%E8%B6%85%E7%BA%A7%E9%A9%AC%E9%87%8C%E5%A5%A5', icon: 'Temp-images/game/shuzi.jpg', desc: '回味童年，原汁原味的像素游戏（可开启作弊）！', featured: true },
        { title: '俄罗斯方块', url: 'https://game.ur1.fun/tetris/', icon: 'https://game.ur1.fun/tetris/favicon.png', desc: '俄罗斯方块游戏机' },
        { title: '合成大西瓜', url: 'https://tool.liumingye.cn/watermelon/', icon: 'Temp-images/game/dxg.jpg', desc: '两个较小的水果相撞即可合成更大的水果。' },
        { title: '飞机大战', url: 'https://game.ur1.fun/plane-wars/', icon: 'https://game.ur1.fun/plane-wars/favicon.png', desc: '微信经典飞机大战' },
        { title: '纸牌', url: 'https://game.ur1.fun/poker/', icon: 'https://game.ur1.fun/poker/favicon.png', desc: 'Windows 纸牌游戏同款玩法' },
        { title: '压扁小鸟', url: 'https://game.ur1.fun/flaser-bird/', icon: 'https://game.ur1.fun/flaser-bird/favicon.png', desc: '跳不过就压扁！' },
        { title: 'looptap', url: 'https://game.ur1.fun/looptap/', icon: 'https://game.ur1.fun/looptap/favicon.png', desc: '消磨时间的小游戏，把球停在有颜色区域' },
        { title: '叠砖块', url: 'https://game.ur1.fun/stack/', icon: 'https://game.ur1.fun/stack/favicon.png', desc: '试试你能叠多高' },
        { title: '小霸王游戏', url: 'https://www.yikm.net/', icon: 'Temp-images/game/poki.jpg', desc: '小霸王游戏网站，您可以免费几百个游戏！' },
        { title: 'mikutap', url: 'https://toolwa.com/mikutap/', icon: 'https://i.postimg.cc/HxbdT88W/favicon.png', desc: '每格区域对应一个声音，随意点击发出不一样的歌曲。' },
        { title: '奔跑吧兔子', url: 'https://game.ur1.fun/hop/', icon: 'https://game.ur1.fun/hop/favicon.png', desc: '神庙逃亡风格的跑酷游戏' },
        { title: '架子鼓模拟器', url: 'https://toolwa.com/durms/', icon: 'https://toolwa.com/durms/favicon.png', desc: '架子鼓是一套以鼓为主的组合性打击乐器' },
        { title: 'AI 五子棋', url: 'https://game.ur1.fun/gomoku/', icon: 'https://game.ur1.fun/gomoku/favicon.png', desc: '试试你能打得过 AI 吗' }
    ];

    // 渲染顶部卡片
    function renderTopFace(games) {
        var html = games.map(function(g, i) {
            var activeClass = i === 0 ? ' active' : '';
            var btnClass = i === 0 ? 'am-btn-primary' : 'am-btn-default';
            return '<li>' +
                '<a href="' + g.url + '">' +
                '<div class="ctl' + activeClass + '">' +
                    '<img src="' + (g.icon || '') + '" onerror="this.src=\'Temp-images/game/poki.jpg\'">' +
                    '<h3>' + g.title + '</h3>' +
                '</div>' +
                '<button type="button" class="am-btn ' + btnClass + '">进入游戏</button>' +
                '</a></li>';
        }).join('');
        $('#topface').html(html);
    }

    // 渲染底部详细列表
    function renderCattlist(games) {
        var html = games.map(function(g, i) {
            var btnClass = i % 2 === 0 ? 'am-btn-warning' : 'am-btn-default';
            return '<li>' +
                '<div class="cattlist_0">' +
                    '<div class="cattlist_1">' +
                        '<div class="am-g">' +
                            '<div class="am-u-sm-4 am-u-md-5 am-u-lg-5 am-vertical-align">' +
                                '<div class="am-vertical-align-middle">' +
                                    '<img src="' + (g.icon || '') + '" onerror="this.src=\'Temp-images/game/poki.jpg\'">' +
                                '</div>' +
                            '</div>' +
                            '<div class="am-u-sm-8 am-u-md-7 am-u-lg-7">' +
                                '<h3>' + g.title + '</h3>' +
                                '<h4>&nbsp;' + (g.desc || '') + '</h4>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="cattlist_3">' +
                        '<a href="' + g.url + '">' +
                        '<button type="button" class="am-btn ' + btnClass + '">' +
                            '<i class="am-icon-plus"></i> 进入游戏' +
                        '</button></a>' +
                    '</div>' +
                '</div>' +
            '</li>';
        }).join('');
        $('#cattlistUl').html(html);
    }

    // 初始化：先渲染静态数据，再异步加载后端动态数据
    renderTopFace(staticGames);
    renderCattlist(staticGames);

    // 轮播切换逻辑
    var countnum = staticGames.length - 1;
    function bindCarousel() {
        $('#leftbtn').off('click').on('click', function() {
            var temp_href = $('#topface li:eq(0) a').attr('href');
            var temp_img = $('#topface li:eq(0) img').attr('src');
            var temp_h3 = $('#topface li:eq(0) h3').html();
            for (var i = 0; i < countnum; i++) {
                var n = i + 1;
                $('#topface li:eq(' + i + ') a').attr('href', $('#topface li:eq(' + n + ') a').attr('href'));
                $('#topface li:eq(' + i + ') img').attr('src', $('#topface li:eq(' + n + ') img').attr('src'));
                $('#topface li:eq(' + i + ') h3').html($('#topface li:eq(' + n + ') h3').html());
            }
            $('#topface li:eq(' + countnum + ') a').attr('href', temp_href);
            $('#topface li:eq(' + countnum + ') img').attr('src', temp_img);
            $('#topface li:eq(' + countnum + ') h3').html(temp_h3);
        });
        $('#rightbtn').off('click').on('click', function() {
            var temp_href = $('#topface li:eq(' + countnum + ') a').attr('href');
            var temp_img = $('#topface li:eq(' + countnum + ') img').attr('src');
            var temp_h3 = $('#topface li:eq(' + countnum + ') h3').html();
            for (var i = countnum; i > 0; i--) {
                var n = i - 1;
                $('#topface li:eq(' + i + ') a').attr('href', $('#topface li:eq(' + n + ') a').attr('href'));
                $('#topface li:eq(' + i + ') img').attr('src', $('#topface li:eq(' + n + ') img').attr('src'));
                $('#topface li:eq(' + i + ') h3').html($('#topface li:eq(' + n + ') h3').html());
            }
            $('#topface li:eq(0) a').attr('href', temp_href);
            $('#topface li:eq(0) img').attr('src', temp_img);
            $('#topface li:eq(0) h3').html(temp_h3);
        });
    }
    bindCarousel();

    // 异步加载后端动态游戏数据
    if (typeof apiUrl === 'function') {
        fetch(apiUrl('/api/public/game')).then(function(res) { return res.json(); }).then(function(dynamicGames) {
            if (dynamicGames && dynamicGames.length > 0) {
                var formatted = dynamicGames.map(function(item) {
                    return {
                        title: item.title || '未知游戏',
                        url: item.location || '#',
                        icon: (item.images && item.images[0]) || '',
                        desc: item.content || ''
                    };
                });
                // 合并：后端数据在前，静态数据在后
                var allGames = formatted.concat(staticGames);
                renderTopFace(allGames);
                renderCattlist(allGames);
                countnum = allGames.length - 1;
                bindCarousel();
            }
        }).catch(function(err) {
            console.error('加载动态游戏数据失败:', err);
        });
    }
</script>
