<html lang="en" >

<style type="text/css">
	/* Please ❤ this if you like it! */
	
	
	@import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900');
	
	:root{
	  font-size: 16px;
	}
	body{
		font-family: 'Poppins', sans-serif;
		font-weight: 900;
		font-size: 16px;
		line-height: 1.7;
		color: #102770;
		background: linear-gradient(135deg, #ffeba7 0%, #ffc371 50%, #ff8a9b 100%);
		background-size: 400% 400%;
		animation: gradientShift 15s ease infinite;
		overflow-x: hidden;
		padding: 10px;
		min-height: 100vh;
	}
	a {
		cursor: pointer;
	  transition: all 200ms linear;
	}
	a:hover {
		text-decoration: none;
	}
	.link {
	  color: #c4c3ca;
	}
	.link:hover {
	  color: #ffeba7;
	}
	.over-hide {
	  overflow: hidden;
	}
	.size-22{
	  font-size: 24px;
	}
	.section{
	  position: relative;
	  width: 100%;
	  z-index: 1;
	  display: block;
	}
	.full-height{
	  min-height: 100vh;
	}
	[type="checkbox"]:checked,
	[type="checkbox"]:not(:checked){
	  position: absolute;
	  opacity: 0;
	  width: 100%;
	  height: 55px;
	  cursor: pointer;
	  z-index: 1;
	  top: 0;
	  left: 0;
	}
	.pricing:checked + label,
	.pricing:not(:checked) + label{
	  position: relative;
	  display: block;
	  text-align: center;
	  width: 100%;
	  max-width: 280px;
	  height: 55px;
	  border-radius: 30px;
	  padding: 0;
	  margin: 0 auto 30px;
	  cursor: pointer;
	  font-family: 'Poppins', sans-serif;
	  font-weight: 600;
	  text-transform: uppercase;
	  font-size: 13px;
	  letter-spacing: 1.2px;
	  line-height: 55px;
	  padding: 0 25px;
	  padding-right: 27px;
	  overflow: hidden;
	  color: #fff;
	  text-align: left;
	  -webkit-tap-highlight-color: transparent;
	  user-select: none;
	  touch-action: manipulation;
	  box-shadow: 0 8px 25px rgba(16, 39, 112, 0.2);
	  transition: all 300ms ease;
	}
	
	.pricing:checked + label:hover,
	.pricing:not(:checked) + label:hover {
	  transform: translateY(-2px);
	  box-shadow: 0 12px 35px rgba(16, 39, 112, 0.3);
	}
	.pricing:checked + label:before,
	.pricing:not(:checked) + label:before{
	  position: absolute;
	  content: '';
	  z-index: -2;
	  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	  width: 100%;
	  height: 100%;
	  display: block;
	  top: 0;
	  left: 0;
	  border-radius: 30px;
	}
	.pricing:checked + label:after,
	.pricing:not(:checked) + label:after{
	  position: absolute;
	  content: '';
	  z-index: -1;
	  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
	  width: calc(50% - 4px);
	  height: 51px;
	  display: block;
	  top: 2px;
	  left: 2px;
	  border-radius: 26px;
	  transition: all 400ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
	  box-shadow: 0 4px 15px rgba(252, 182, 159, 0.4);
	}
	.pricing:checked + label:after {
	  left: calc(50% + 2px);
	}
	.block-diff {
	  display: block;
	  mix-blend-mode: difference;
	}
	
	.card-3d-wrap {
	  position: relative;
	  width: 100%;
	  max-width: 380px;
	  height: 600px;
	  -webkit-transform-style: preserve-3d;
	  transform-style: preserve-3d;
	  perspective: 1000px;
	  margin-top: 20px;
	}
	.card-3d-wrapper {
	  width: 100%;
	  height: 100%;
	  position:absolute;    
	  top: 0;
	  left: 0;  
	  -webkit-transform-style: preserve-3d;
	  transform-style: preserve-3d;
	  transition: transform 350ms ease-out; 
	}
	.card-front, .card-back {
	  width: 100%;
	  height: 100%;
	  background: linear-gradient(145deg, #ffffff, #f0f9ff);
	  position: absolute;
	  border-radius: 20px;
	  left: 0;
	  top: 0;
	  -webkit-transform-style: preserve-3d;
	  transform-style: preserve-3d;
	  -webkit-backface-visibility: hidden;
	  -moz-backface-visibility: hidden;
	  -o-backface-visibility: hidden;
	  backface-visibility: hidden;
	  box-shadow: 
	    0 20px 40px rgba(16, 39, 112, 0.1),
	    0 8px 20px rgba(16, 39, 112, 0.05),
	    inset 0 1px 0 rgba(255, 255, 255, 0.8);
	  border: 1px solid rgba(255, 255, 255, 0.3);
	  backdrop-filter: blur(10px);
	  overflow: hidden;
	}
	.card-back {
	  transform: rotateY(180deg);
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper {
	  transform: rotateY(180deg);
	  transition: transform 350ms ease-out; 
	}
	.pricing-wrap{
	  position: relative;
	  padding-top: 80px;
	  width: 100%;
	  display: block;
	  z-index: 1;
	  -webkit-transform-style: preserve-3d;
	  transform-style: preserve-3d;
	  -webkit-backface-visibility: hidden;
	  -moz-backface-visibility: hidden;
	  -o-backface-visibility: hidden;
	  backface-visibility: hidden;
	  padding-left: 20px;
	  padding-right: 20px;
	}
	.pricing-wrap h4{
	  position: relative;
	  width: 100%;
	  display: block;
	  text-align: center;
	  font-family: 'Poppins', sans-serif;
	  font-weight: 700;
	  letter-spacing: 2px;
	  font-size: 18px;
	  line-height: 1.5;
	  color: #102770;
	  transform: translate3d(0, 0, 35px) perspective(100px);
	  margin-bottom: 15px;
	}
	.pricing-wrap h4:before{
	  position: absolute;
	  content: '';
	  z-index: -1;
	  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
	  background-size: 200% 200%;
	  width: 60px;
	  height: 60px;
	  display: block;
	  top: 50%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
	  animation: border-transform 8s linear infinite, backgroundShift 4s ease infinite;
	}
	.card-back .pricing-wrap h4:before{
	  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #d299c2 100%);
	  background-size: 200% 200%;
	  box-shadow: 0 8px 25px rgba(168, 237, 234, 0.4);
	  animation: border-transform 8s linear infinite, backgroundShift 4s ease infinite;
	}
	
	@keyframes backgroundShift {
	  0% { background-position: 0% 50%; }
	  50% { background-position: 100% 50%; }
	  100% { background-position: 0% 50%; }
	}
	@keyframes border-transform{
	    0%,100% { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; } 
	  14% { border-radius: 40% 60% 54% 46% / 49% 60% 40% 51%; } 
	  28% { border-radius: 54% 46% 38% 62% / 49% 70% 30% 51%; } 
	  42% { border-radius: 61% 39% 55% 45% / 61% 38% 62% 39%; } 
	  56% { border-radius: 61% 39% 67% 33% / 70% 50% 50% 30%; } 
	  70% { border-radius: 50% 50% 34% 66% / 56% 68% 32% 44%; } 
	  84% { border-radius: 46% 54% 50% 50% / 35% 61% 39% 65%; } 
	}
	
	/* 背景渐变动画 */
	@keyframes gradientShift {
	  0% { background-position: 0% 50%; }
	  50% { background-position: 100% 50%; }
	  100% { background-position: 0% 50%; }
	}
	
	/* 浮动粒子效果 */
	.particles {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100%;
	  height: 100%;
	  pointer-events: none;
	  z-index: -1;
	}
	
	.particle {
	  position: absolute;
	  background: rgba(255, 255, 255, 0.6);
	  border-radius: 50%;
	  animation: float 6s ease-in-out infinite;
	}
	
	.particle:nth-child(1) {
	  width: 8px;
	  height: 8px;
	  top: 20%;
	  left: 10%;
	  animation-delay: 0s;
	}
	
	.particle:nth-child(2) {
	  width: 12px;
	  height: 12px;
	  top: 60%;
	  left: 80%;
	  animation-delay: 2s;
	}
	
	.particle:nth-child(3) {
	  width: 6px;
	  height: 6px;
	  top: 80%;
	  left: 20%;
	  animation-delay: 4s;
	}
	
	.particle:nth-child(4) {
	  width: 10px;
	  height: 10px;
	  top: 30%;
	  left: 70%;
	  animation-delay: 1s;
	}
	
	.particle:nth-child(5) {
	  width: 14px;
	  height: 14px;
	  top: 70%;
	  left: 50%;
	  animation-delay: 3s;
	}
	
	@keyframes float {
	  0%, 100% {
	    transform: translateY(0px) rotate(0deg);
	    opacity: 0.8;
	  }
	  50% {
	    transform: translateY(-20px) rotate(180deg);
	    opacity: 0.3;
	  }
	}
	.pricing-wrap h2{
	  position: relative;
	  width: 100%;
	  display: block;
	  text-align: center;
	  font-family: 'Poppins', sans-serif;
	  font-weight: 400;
	  letter-spacing: 1px;
	  font-size: 24px;
	  line-height: 1.2;
	  color: #102770;
	  transform: translate3d(0, 0, 30px) perspective(100px);
	  margin-bottom: 10px;
	}
	.pricing-wrap h2 sup{
	  font-size: 14px;
	}
	.pricing-wrap p{
	  position: relative;
	  width: 100%;
	  display: block;
	  text-align: center;
	  font-family: 'Poppins', sans-serif;
	  font-weight: 500;
	  font-size: 12px;
	  line-height: 1.3;
	  letter-spacing: 0.5px;
	  color: #102770;
	  transform: translate3d(0, 0, 30px) perspective(100px);
	  margin-bottom: 8px;
	}
	.card-back h2,
	.card-back p,
	.card-back h4{
	  color: #0c1c00;
	}
	.link {
	  position: relative;
	  padding: 12px 24px;
	  border-radius: 25px;
	  display: inline-block;
	  text-align: center;
	  color: #fff;
	  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	  transition: all 300ms ease;
	  font-family: 'Poppins', sans-serif;
	  font-weight: 500;
	  font-size: 13px;
	  line-height: 1.2;
	  transform: translate3d(0, 0, 30px) perspective(100px);
	  margin-top: 15px;
	  text-decoration: none;
	  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
	  overflow: hidden;
	  z-index: 20;
	  pointer-events: auto;
	}
	
	.link:before {
	  content: '';
	  position: absolute;
	  top: 0;
	  left: -100%;
	  width: 100%;
	  height: 100%;
	  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
	  transition: left 600ms ease;
	}
	
	.link:hover:before {
	  left: 100%;
	}
	
	.link:hover {
	  color: #fff;
	  transform: translate3d(0, -2px, 30px) perspective(100px) scale(1.05);
	  box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
	}
	.card-back .link{
	  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
	  box-shadow: 0 6px 20px rgba(168, 237, 234, 0.3);
	}
	.card-back .link:hover{
	  color: #fff;
	  transform: translate3d(0, -2px, 30px) perspective(100px) scale(1.05);
	  box-shadow: 0 10px 30px rgba(168, 237, 234, 0.4);
	}
	.img-wrap img{
	  width: 100%;
	  height: auto;
	  display: block;
	  pointer-events: none;
	}
	.img-1{
	  position: absolute;
	  display: block;
	  left: -80px;
	  top: -25px;
	  z-index: 5;
	  width: calc(70% + 120px);
	  transform: translate3d(0, 0, 45px) perspective(100px);
	  opacity: 1;
	  pointer-events: auto;
	  transition: transform 300ms 200ms ease, opacity 300ms 200ms ease;
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper .img-1 {
	  opacity: 0;
	  transform: translate3d(-25px, 15px, 45px) perspective(100px);
	  pointer-events: none;
	  transition: transform 300ms ease, opacity 200ms ease;
	}
	.img-2 {
	  position: absolute;
	  display: block;
	  left: 0;
	  top: 0;
	  z-index: 1;
	  border-top-left-radius: 6px;
	  border-top-right-radius: 6px;
	  overflow: hidden;
	  width: 100%;
	  transform: translate3d(0, 0, 15px) perspective(100px);
	}
	.img-3{
	  position: absolute;
	  display: block;
	  right: -45px;
	  top: -70px;
	  z-index: 5;
	  width: calc(50% + 10px);
	  transform: translate3d(0, 0, 55px) perspective(100px) scale(1);
	  opacity: 1;
	  pointer-events: auto;
	  transition: transform 250ms 250ms ease, opacity 200ms 250ms ease;
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper .img-3 {
	  opacity: 0;
	  transform: translate3d(-25px, 5px, 55px) perspective(100px) scale(0.4);
	  pointer-events: none;
	  transition: transform 300ms ease, opacity 200ms ease;
	}
	.img-6{
	  position: absolute;
	  display: block;
	  right: -10px;
	  bottom: -120px;
	  z-index: 5;
	  width: calc(35% + 15px);
	  transform: translate3d(0, 0, 25px) perspective(100px) scale(1);
	  opacity: 1;
	  pointer-events: auto;
	  transition: transform 250ms 250ms ease, opacity 200ms 250ms ease;
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper .img-6 {
	  opacity: 0;
	  transform: translate3d(0, 0, 25px) perspective(100px) scale(0.4);
	  pointer-events: none;
	  transition: transform 300ms ease, opacity 200ms ease;
	}
	
	.img-4{
	  position: absolute;
	  display: block;
	  left: -75px;
	  top: -30px;
	  z-index: 5;
	  width: calc(60% + 30px);
	  transform: translate3d(0, 0, 45px) perspective(100px) scale(0.5);
	  opacity: 0;
	  pointer-events: none;
	  transition: transform 300ms ease, opacity 200ms ease;
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper .img-4 {
	  opacity: 1;
	  pointer-events: auto;
	  transform: translate3d(0, 0, 45px) perspective(100px) scale(1);
	  transition: transform 300ms 200ms ease, opacity 250ms 200ms ease;
	}
	.img-5{
	  position: absolute;
	  display: block;
	  right: -35px;
	  top: -25px;
	  z-index: 6;
	  width: calc(55% + 35px);
	  transform: translate3d(0, 0, 35px) perspective(100px) scale(0.5) rotate(0deg);
	  opacity: 0;
	  pointer-events: none;
	  transition: transform 300ms ease, opacity 200ms ease;
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper .img-5 {
	  opacity: 1;
	  pointer-events: auto;
	  transform: translate3d(0, 0, 35px) perspective(100px) scale(1) rotate(10deg);
	  transition: transform 300ms 250ms ease, opacity 250ms 250ms ease;
	}
	.img-7{
	  position: absolute;
	  display: block;
	  right: -15px;
	  bottom: -120px;
	  z-index: 6;
	  width: calc(35% + 15px);
	  transform: translate3d(0, 0, 35px) perspective(100px) scale(0.5);
	  opacity: 0;
	  pointer-events: none;
	  transition: transform 300ms ease, opacity 200ms ease;
	}
	.pricing:checked ~ .card-3d-wrap .card-3d-wrapper .img-7 {
	  opacity: 1;
	  pointer-events: auto;
	  transform: translate3d(0, 0, 35px) perspective(100px) scale(1);
	  transition: transform 300ms 250ms ease, opacity 250ms 250ms ease;
	}
	
	/* 移动端适配 */
	@media (max-width: 768px) {
	  body {
	    padding: 5px;
	  }
	  
	  .card-3d-wrap {
	    max-width: 320px;
	    height: 520px;
	    margin-top: 10px;
	  }
	  
	  .pricing-wrap {
	    padding-top: 60px;
	    padding-left: 15px;
	    padding-right: 15px;
	  }
	  
	  .pricing-wrap h4 {
	    font-size: 16px;
	    letter-spacing: 1px;
	    margin-bottom: 10px;
	  }
	  
	  .pricing-wrap h4:before {
	    width: 40px;
	    height: 40px;
	  }
	  
	  .pricing-wrap h2 {
	    font-size: 20px;
	    margin-bottom: 8px;
	  }
	  
	  .pricing-wrap h2 sup {
	    font-size: 12px;
	  }
	  
	  .pricing-wrap p {
	    font-size: 11px;
	    margin-bottom: 6px;
	  }
	  
	  .size-22 {
	    font-size: 20px;
	  }
	  
	  .link {
	    padding: 6px 12px;
	    font-size: 11px;
	  }
	  
	  .pricing:checked + label,
	  .pricing:not(:checked) + label {
	    font-size: 11px;
	    padding: 0 20px;
	    padding-right: 22px;
	    max-width: 240px;
	    height: 50px;
	    line-height: 50px;
	    margin-bottom: 20px;
	  }
	  
	  .pricing:checked + label:after,
	  .pricing:not(:checked) + label:after {
	    height: 46px;
	  }
	}
	
	/* 增强切换按钮的响应区域 */
	.pricing:checked + label,
	.pricing:not(:checked) + label {
	  position: relative;
	  user-select: none;
	  -webkit-tap-highlight-color: transparent;
	  touch-action: manipulation;
	}
	
	@media (max-width: 480px) {
	  .card-3d-wrap {
	    max-width: 280px;
	    height: 480px;
	  }
	  
	  .pricing-wrap {
	    padding-top: 50px;
	    padding-left: 10px;
	    padding-right: 10px;
	  }
	  
	  .pricing-wrap h4 {
	    font-size: 14px;
	  }
	  
	  .pricing-wrap h2 {
	    font-size: 18px;
	  }
	  
	  .img-1 {
	    left: -60px;
	    width: calc(65% + 100px);
	  }
	  
	  .img-3 {
	    right: -35px;
	    width: calc(45% + 5px);
	  }
	  
	  .img-4 {
	    left: -60px;
	    width: calc(55% + 25px);
	  }
	  
	  .img-5 {
	    right: -25px;
	    width: calc(50% + 25px);
	  }
	}
	

</style>
