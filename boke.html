    <style>
        html,body{margin:0 auto;width:100%;overflow-x:hidden;}
        .am-topbar{background:#333;}
        
        /* 分页样式 */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            gap: 10px;
        }
        
        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 5px;
        }
        
        .pagination li {
            display: inline-block;
        }
        
        .pagination a, .pagination span {
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            border: 1px solid #ddd;
            color: #333;
            border-radius: 4px;
            transition: all 0.3s ease;
            min-width: 40px;
            text-align: center;
        }
        
        .pagination a:hover {
            background-color: #e1652f;
            color: white;
            border-color: #e1652f;
        }
        
        .pagination .current {
            background-color: #e1652f;
            color: white;
            border-color: #e1652f;
        }
        
        .pagination .disabled {
            color: #ccc;
            cursor: not-allowed;
            background-color: #f5f5f5;
        }
        
        .pagination .disabled:hover {
            background-color: #f5f5f5;
            color: #ccc;
            border-color: #ddd;
        }
        
        /* 页面信息 */
        .page-info {
            color: #666;
            font-size: 14px;
            margin: 0 15px;
        }
        
        /* 每页显示数量选择器 */
        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }
        
        .page-size-selector select {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        
        /* 搜索框 */
        .blog-search {
            max-width: 400px;
            margin: 20px auto;
            position: relative;
        }
        
        .blog-search input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .blog-search input:focus {
            border-color: #e1652f;
        }
        
        .blog-search button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #e1652f;
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
        
        .blog-search button:hover {
            background: #d55a2a;
        }
        
        /* 博客项目动画 */
        .blog-item {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        
        .blog-item.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 加载动画 */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e1652f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 无结果提示 */
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            display: none;
        }
        
        .no-results i {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .pagination-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .pagination a, .pagination span {
                padding: 6px 10px;
                min-width: 35px;
                font-size: 14px;
            }
            
            .page-info {
                order: -1;
            }
            
            .blog-search {
                margin: 15px;
            }
        }

            padding:15px 0 2px;
            text-align:center;
            width:100%;
            margin-top: 40px;
        }

// 分页管理类
class BlogPagination {
    constructor() {
        this.currentPage = 1;
        this.pageSize = 6;
        this.totalItems = 0;
        this.filteredData = [...blogData];
        this.searchTerm = '';
        
        this.blogList = document.getElementById('blogList');
        this.pagination = document.getElementById('pagination');
        this.pageInfo = document.getElementById('pageInfo');
        this.searchInput = document.getElementById('searchInput');
        this.searchBtn = document.getElementById('searchBtn');
        this.pageSizeSelect = document.getElementById('pageSizeSelect');
        this.loadingSpinner = document.getElementById('loadingSpinner');
        this.noResults = document.getElementById('noResults');
        
        this.init();
    }
    
    init() {
        this.bindEvents();
        this.updateData();
        this.render();
    }
    
    bindEvents() {
        // 搜索事件
        this.searchBtn.addEventListener('click', () => this.handleSearch());
        this.searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                this.handleSearch();
            }
        });
        
        // 每页显示数量变化
        this.pageSizeSelect.addEventListener('change', (e) => {
            this.pageSize = parseInt(e.target.value);
            this.currentPage = 1;
            this.updateData();
            this.render();
        });
        
        // 实时搜索（可选）
        this.searchInput.addEventListener('input', (e) => {
            clearTimeout(this.searchTimeout);
            this.searchTimeout = setTimeout(() => {
                this.handleSearch();
            }, 500);
        });
    }
    
    handleSearch() {
        this.searchTerm = this.searchInput.value.trim().toLowerCase();
        this.currentPage = 1;
        this.updateData();
        this.render();
    }
    
    updateData() {
        // 过滤数据
        if (this.searchTerm) {
            this.filteredData = blogData.filter(blog => 
                blog.title.toLowerCase().includes(this.searchTerm) ||
                blog.description.toLowerCase().includes(this.searchTerm) ||
                blog.tags.some(tag => tag.toLowerCase().includes(this.searchTerm))
            );
        } else {
            this.filteredData = [...blogData];
        }
        
        this.totalItems = this.filteredData.length;
    }
    
    render() {
        this.showLoading();
        
        // 模拟加载延迟
        setTimeout(() => {
            this.renderBlogList();
            this.renderPagination();
            this.renderPageInfo();
            this.hideLoading();
        }, 300);
    }
    
    showLoading() {
        this.loadingSpinner.style.display = 'block';
        this.blogList.style.opacity = '0.5';
        this.noResults.style.display = 'none';
    }
    
    hideLoading() {
        this.loadingSpinner.style.display = 'none';
        this.blogList.style.opacity = '1';
    }
    
    renderBlogList() {
        const startIndex = (this.currentPage - 1) * this.pageSize;
        const endIndex = startIndex + this.pageSize;
        const currentPageData = this.filteredData.slice(startIndex, endIndex);
        
        if (currentPageData.length === 0) {
            this.blogList.innerHTML = '';
            this.noResults.style.display = 'block';
            return;
        }
        
        this.noResults.style.display = 'none';
        
        const blogHTML = currentPageData.map(blog => `
            <li class="blog-item">
                <div class="am-gallery-item">
                    <a href="http://s.amazeui.org/media/i/demos/bing-2.jpg" class="">
                        <i class="fa fa-heartbeat" style="font-size:20px;color:red">${blog.id}</i>
                        <a href="${blog.url}">
                            <div class="efe">${blog.title}</div>
                            <p>${blog.description}</p>
                        </a>
                        <div class="am-gallery-desc fee">
                            <div class="am-fl">${blog.location}</div>
                            <div class="am-fr">${blog.date}</div>
                        </div>
                    </a>
                </div>
            </li>
        `).join('');
        
        this.blogList.innerHTML = blogHTML;
        
        // 添加动画效果
        setTimeout(() => {
            const blogItems = this.blogList.querySelectorAll('.blog-item');
            blogItems.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('show');
                }, index * 100);
            });
        }, 50);
    }
    
    renderPagination() {
        const totalPages = Math.ceil(this.totalItems / this.pageSize);
        
        if (totalPages <= 1) {
            this.pagination.innerHTML = '';
            return;
        }
        
        let paginationHTML = '';
        
        // 上一页按钮
        if (this.currentPage > 1) {
            paginationHTML += `<li><a href="#" data-page="${this.currentPage - 1}">‹ 上一页</a></li>`;
        } else {
            paginationHTML += `<li><span class="disabled">‹ 上一页</span></li>`;
        }
        
        // 页码按钮
        const startPage = Math.max(1, this.currentPage - 2);
        const endPage = Math.min(totalPages, this.currentPage + 2);
        
        if (startPage > 1) {
            paginationHTML += `<li><a href="#" data-page="1">1</a></li>`;
            if (startPage > 2) {
                paginationHTML += `<li><span class="disabled">...</span></li>`;
            }
        }
        
        for (let i = startPage; i <= endPage; i++) {
            if (i === this.currentPage) {
                paginationHTML += `<li><span class="current">${i}</span></li>`;
            } else {
                paginationHTML += `<li><a href="#" data-page="${i}">${i}</a></li>`;
            }
        }
        
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                paginationHTML += `<li><span class="disabled">...</span></li>`;
            }
            paginationHTML += `<li><a href="#" data-page="${totalPages}">${totalPages}</a></li>`;
        }
        
        // 下一页按钮
        if (this.currentPage < totalPages) {
            paginationHTML += `<li><a href="#" data-page="${this.currentPage + 1}">下一页 ›</a></li>`;
        } else {
            paginationHTML += `<li><span class="disabled">下一页 ›</span></li>`;
        }
        
        this.pagination.innerHTML = paginationHTML;
        
        // 绑定分页点击事件
        this.pagination.addEventListener('click', (e) => {
            e.preventDefault();
            if (e.target.tagName === 'A' && e.target.dataset.page) {
                this.currentPage = parseInt(e.target.dataset.page);
                this.render();
                
                // 滚动到顶部
                document.querySelector('.star').scrollIntoView({ 
                    behavior: 'smooth' 
                });
            }
        });
    }
    
    renderPageInfo() {
        const startItem = (this.currentPage - 1) * this.pageSize + 1;
        const endItem = Math.min(this.currentPage * this.pageSize, this.totalItems);
        const totalPages = Math.ceil(this.totalItems / this.pageSize);
        
        if (this.totalItems === 0) {
            this.pageInfo.textContent = '';
            return;
        }
        
        this.pageInfo.textContent = `显示 ${startItem}-${endItem} 条，共 ${this.totalItems} 条 (第 ${this.currentPage}/${totalPages} 页)`;
    }
}

// 页面加载完成后初始化分页
document.addEventListener('DOMContentLoaded', () => {
    new BlogPagination();
});
</script>
</body>
