        html,
        body {
            margin: 0 auto;
            width: 100%;
            overflow-x: hidden;
        }

        .am-topbar {
            background: #333;
        }

        /* 图片悬停效果 */
        .gallery-img {
            transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border-radius: 8px;
            margin: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .gallery-img:hover {
            transform: scale(1.05);
            opacity: 0.9;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        /* 图片画廊容器 */
        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 20px;
        }

        /* 图片查看器模态框 */
        .image-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .image-viewer.active {
            display: flex;
        }

        .viewer-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* 导航按钮 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            transition: all 0.3s ease;
            z-index: 10001;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .nav-btn.prev {
            left: 20px;
        }

        .nav-btn.next {
            right: 20px;
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #333;
            transition: all 0.3s ease;
            z-index: 10001;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.1);
        }

        /* 图片信息 */
        .image-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 13px;
            z-index: 10001;
            backdrop-filter: blur(5px);
            max-width: 300px;
        }

        /* 缩略图导航 */
        .thumbnail-nav {
            position: absolute;
            top: 20px;
            right: 80px;
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 20px;
            max-width: 400px;
            overflow-x: auto;
            z-index: 10001;
            backdrop-filter: blur(5px);
        }

        .thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .thumbnail:hover {
            opacity: 0.8;
        }

        .thumbnail.active {
            opacity: 1;
            border-color: #fff;
        }

        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .nav-btn.prev {
                left: 10px;
            }

            .nav-btn.next {

            .close-btn {

        }
    </style>

    <script>
        // 延迟加载JavaScript
        const loadScript = (src, callback) => {
            const script = document.createElement('script');
            script.src = src;
            script.async = true;
            if (callback) script.onload = callback;
            document.head.appendChild(script);
        };

        // 立即加载jQuery
        loadScript('assets/js/jquery.min.js', () => {
            loadScript('assets/js/amazeui.min.js');
            loadScript('js/public.js');
        });

        // 图片查看器功能
        class ImageViewer {
            constructor() {
                this.currentImages = [];
                this.currentIndex = 0;
                this.isOpen = false;

                this.viewer = document.getElementById('imageViewer');
                this.viewerImage = document.getElementById('viewerImage');
                this.imageInfo = document.getElementById('imageInfo');
                this.imageTitle = document.getElementById('imageTitle');
                this.imageCounter = document.getElementById('imageCounter');
                this.thumbnailNav = document.getElementById('thumbnailNav');
                this.loading = document.getElementById('imageLoading');

                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.closeBtn = document.getElementById('closeBtn');

                this.init();
            }

            init() {
                // 为所有图片添加点击事件
                document.querySelectorAll('.gallery-img').forEach((img, index) => {
                    img.addEventListener('click', (e) => {
                        const gallery = e.target.closest('[data-gallery]');
                        const galleryImages = gallery.querySelectorAll('.gallery-img');
                        const imageIndex = Array.from(galleryImages).indexOf(e.target);
                        this.openViewer(galleryImages, imageIndex);
                    });
                });

                // 导航按钮事件
                this.prevBtn.addEventListener('click', () => this.showPrevious());
                this.nextBtn.addEventListener('click', () => this.showNext());
                this.closeBtn.addEventListener('click', () => this.closeViewer());

                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (!this.isOpen) return;

                    switch (e.key) {
                        case 'ArrowLeft':
                            this.showPrevious();
                            break;
                        case 'ArrowRight':
                            this.showNext();
                            break;
                        case 'Escape':
                            this.closeViewer();
                            break;
                    }
                });

                // 点击背景关闭
                this.viewer.addEventListener('click', (e) => {
                    if (e.target === this.viewer) {
                        this.closeViewer();
                    }
                });

                // 触摸滑动支持
                this.addTouchSupport();
            }

            openViewer(images, startIndex = 0) {
                this.currentImages = Array.from(images);
                this.currentIndex = startIndex;
                this.isOpen = true;

                this.viewer.classList.add('active');
                document.body.style.overflow = 'hidden';

                this.showImage(this.currentIndex);
                this.createThumbnails();
            }

            showImage(index) {
                if (index < 0 || index >= this.currentImages.length) return;

                this.currentIndex = index;
                const img = this.currentImages[index];

                // 显示加载动画
                this.loading.style.display = 'block';
                this.viewerImage.style.display = 'none';

                // 加载图片
                const newImg = new Image();
                newImg.onload = () => {
                    this.viewerImage.src = newImg.src;
                    this.viewerImage.alt = img.alt;

                    // 更新信息
                    this.imageTitle.textContent = img.dataset.title || img.alt || '图片';
                    this.imageCounter.textContent = ` (${index + 1}/${this.currentImages.length})`;

                    // 隐藏加载动画，显示图片
                    this.loading.style.display = 'none';
                    this.viewerImage.style.display = 'block';

                    // 更新缩略图状态
                    this.updateThumbnails();
                };

                newImg.onerror = () => {
                    this.loading.style.display = 'none';
                    this.imageTitle.textContent = '图片加载失败';
                    this.imageCounter.textContent = ` (${index + 1}/${this.currentImages.length})`;
                };

                newImg.src = img.src;

                // 更新导航按钮状态
                this.prevBtn.style.display = this.currentImages.length > 1 ? 'block' : 'none';
                this.nextBtn.style.display = this.currentImages.length > 1 ? 'block' : 'none';
            }

            showPrevious() {
                const newIndex = this.currentIndex > 0 ? this.currentIndex - 1 : this.currentImages.length - 1;
                this.showImage(newIndex);
            }

            showNext() {
                const newIndex = this.currentIndex < this.currentImages.length - 1 ? this.currentIndex + 1 : 0;
                this.showImage(newIndex);
            }

            closeViewer() {
                this.isOpen = false;
                this.viewer.classList.remove('active');
                document.body.style.overflow = '';
            }

            createThumbnails() {
                if (this.currentImages.length <= 1) {
                    this.thumbnailNav.style.display = 'none';
                    return;
                }

                this.thumbnailNav.style.display = 'flex';
                this.thumbnailNav.innerHTML = '';

                this.currentImages.forEach((img, index) => {
                    const thumbnail = document.createElement('img');
                    thumbnail.src = img.src;
                    thumbnail.className = 'thumbnail';
                    thumbnail.alt = `缩略图 ${index + 1}`;
                    thumbnail.addEventListener('click', () => this.showImage(index));
                    this.thumbnailNav.appendChild(thumbnail);
                });
            }

            updateThumbnails() {
                const thumbnails = this.thumbnailNav.querySelectorAll('.thumbnail');
                thumbnails.forEach((thumb, index) => {
                    thumb.classList.toggle('active', index === this.currentIndex);
                });
            }

            addTouchSupport() {
                let startX = 0;
                let startY = 0;

                this.viewerImage.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                });

                this.viewerImage.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;

                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;

                    const diffX = startX - endX;
                    const diffY = startY - endY;

                    // 水平滑动距离大于垂直滑动距离，且滑动距离足够
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                        if (diffX > 0) {
                            // 向左滑动，显示下一张
                            this.showNext();
                        } else {
                            // 向右滑动，显示上一张
                            this.showPrevious();
                        }
                    }

                    startX = 0;
                    startY = 0;
                });
            }
        }

        // 页面加载完成后初始化图片查看器
        document.addEventListener('DOMContentLoaded', () => {
            new ImageViewer();
        });
    </script>
